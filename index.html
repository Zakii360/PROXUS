<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="PROXUS" />
  <title>PROXUS</title>

  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@19.3.0",
      "react/jsx-runtime": "https://esm.sh/react@19.3.0/jsx-runtime",
      "react/jsx-dev-runtime": "https://esm.sh/react@19.3.0/jsx-dev-runtime",
      "react-dom": "https://esm.sh/react-dom@19.3.0",
      "react-dom/client": "https://esm.sh/react-dom@19.3.0/client",
      "motion/react": "https://esm.sh/motion@12.23.12/react?external=react,react-dom"
    }
  }
  </script>

  <style>
    @import url("https://cdn.jsdelivr.net/npm/@fontsource-variable/geist@5.2.8/index.css");
    @import url("https://cdn.jsdelivr.net/npm/@fontsource-variable/manrope@5.2.8/index.css");

    :root {
      --bg:#000;
      --surface:rgba(16,16,20,.76);
      --surface-2:rgba(23,23,28,.82);
      --surface-3:rgba(31,31,37,.9);
      --border:rgba(255,255,255,.09);
      --border-strong:rgba(255,255,255,.16);
      --text:#f5f6f8;
      --muted:#96969e;
      --muted-2:#66666e;
      --sidebar:240px;
      --ease:cubic-bezier(.16,1,.3,1);
    }

    *{box-sizing:border-box}
    html,body,#root{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
    body{
      color:var(--text);
      font-family:Geist Variable,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }
    button,input{font:inherit;color:inherit}
    button{border:0;background:none;cursor:pointer}
    input{outline:none}
    svg{display:block}

    .app{
      position:relative;
      width:100%;
      height:100%;
      overflow:hidden;
      background:
        radial-gradient(circle at 70% -20%, rgba(37,54,104,.11), transparent 35%),
        radial-gradient(circle at 0 100%, rgba(8,75,92,.055), transparent 31%),
        #000;
    }

    .dust{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      z-index:0;
      pointer-events:none;
    }

    .shell{
      position:relative;
      z-index:1;
      width:100%;
      height:100%;
      display:flex;
    }

    .sidebar{
      position:relative;
      z-index:20;
      width:var(--sidebar);
      min-width:0;
      height:100%;
      flex:0 0 var(--sidebar);
      overflow:hidden;
      border-right:1px solid var(--border);
      background:rgba(7,7,9,.78);
      backdrop-filter:blur(28px) saturate(1.3);
      -webkit-backdrop-filter:blur(28px) saturate(1.3);
    }

    .sidebar-inner{
      height:100%;
      padding:8px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .brand{
      height:38px;
      display:flex;
      align-items:center;
      gap:9px;
      padding:0 5px;
    }

    .brand-mark{
      width:28px;
      height:28px;
      border-radius:6px;
      background:#fff;
      color:#000;
      display:grid;
      place-items:center;
      font-family:Manrope Variable,sans-serif;
      font-size:10px;
      font-weight:800;
      letter-spacing:-.06em;
      flex:0 0 auto;
    }

    .brand-name{font-size:13px;font-weight:650;line-height:1}
    .brand-sub{margin-top:3px;color:var(--muted-2);font-size:9px}

    .side-search{
      height:34px;
      display:flex;
      align-items:center;
      gap:7px;
      padding:0 9px;
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:5px;
    }

    .side-search:focus-within{background:var(--surface-2);border-color:var(--border-strong)}
    .side-search input{width:100%;height:100%;background:none;border:0;font-size:11px}
    .side-search input::placeholder{color:var(--muted-2)}

    .bookmarks{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
    .bookmark{
      height:36px;
      border:1px solid transparent;
      border-radius:5px;
      background:rgba(255,255,255,.025);
      color:var(--muted);
      display:grid;
      place-items:center;
      font-size:9px;
      font-weight:650;
    }
    .bookmark:hover{background:var(--surface-2);border-color:var(--border);color:var(--text)}

    .new-tab{
      height:36px;
      display:flex;
      align-items:center;
      gap:9px;
      padding:0 9px;
      border-radius:5px;
      color:var(--muted);
      font-size:11px;
    }
    .new-tab:hover{background:var(--surface-2);color:var(--text)}

    .tab-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:2px;min-height:0;overflow:auto;scroll-behavior:smooth;flex:1}

    .tab{
      position:relative;
      min-height:36px;
      display:flex;
      align-items:center;
      gap:8px;
      padding:0 7px;
      border-radius:5px;
      color:var(--muted);
      overflow:hidden;
    }
    .tab:hover{color:var(--text)}
    .tab-title{position:relative;z-index:1;min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}
    .tab-close{position:relative;z-index:2;width:20px;height:20px;display:grid;place-items:center;border-radius:4px;color:var(--muted);opacity:0}
    .tab:hover .tab-close,.tab.active .tab-close{opacity:1}
    .tab-close:hover{background:rgba(255,255,255,.08);color:var(--text)}
    .tab-highlight{position:absolute;inset:0;border-radius:5px;background:var(--surface-2);z-index:0}

    .side-bottom{padding-top:6px;border-top:1px solid var(--border);display:grid;gap:2px}
    .side-button{height:34px;display:flex;align-items:center;gap:9px;padding:0 9px;border-radius:5px;color:var(--muted);font-size:11px}
    .side-button:hover{background:var(--surface-2);color:var(--text)}

    .main{min-width:0;min-height:0;flex:1;height:100%;display:flex;flex-direction:column}

    .toolbar{
      position:relative;
      z-index:120;
      height:52px;
      flex:0 0 52px;
      display:flex;
      align-items:center;
      gap:6px;
      padding:8px;
      border-bottom:1px solid var(--border);
      background:rgba(5,5,7,.68);
      backdrop-filter:blur(26px) saturate(1.3);
      -webkit-backdrop-filter:blur(26px) saturate(1.3);
    }

    .toolbar-actions{display:flex;gap:2px;align-items:center}
    .icon-button{
      position:relative;
      width:28px;
      height:28px;
      display:grid;
      place-items:center;
      border-radius:5px;
      color:var(--muted);
    }
    .icon-button:hover:not(:disabled){background:var(--surface-2);color:var(--text)}
    .icon-button:disabled{opacity:.27;cursor:not-allowed}

    .vpn-wrap{position:relative;flex:0 0 auto;z-index:150}
    .vpn-button{height:36px;display:flex;align-items:center;gap:7px;padding:0 10px;border:1px solid var(--border);border-radius:7px;background:rgba(255,255,255,.035);color:var(--text);font:inherit;font-size:11px;cursor:pointer;transition:background .2s,border-color .2s,transform .2s}
    .vpn-button:hover{background:var(--surface-2);border-color:rgba(255,255,255,.16)}
    .vpn-dot{width:6px;height:6px;border-radius:50%;background:#67e8a5;box-shadow:0 0 0 3px rgba(103,232,165,.08)}
    .vpn-menu{position:absolute;right:0;top:42px;width:220px;padding:8px;border:1px solid var(--border);border-radius:10px;background:rgba(12,12,15,.96);box-shadow:0 18px 45px rgba(0,0,0,.38);backdrop-filter:blur(24px);z-index:220}
    .vpn-menu-row{display:flex;align-items:center;justify-content:space-between;padding:9px 10px;border-radius:7px;font-size:11px}
    .vpn-menu-row:hover{background:var(--surface-2)}

    .omnibox-wrap{position:relative;flex:1;min-width:0}
    .omnibox{
      height:36px;
      display:flex;
      align-items:center;
      gap:8px;
      padding:0 9px;
      border:1px solid var(--border);
      border-radius:5px;
      background:var(--surface);
    }
    .omnibox:focus-within{background:var(--surface-2);border-color:var(--border-strong)}
    .omnibox input{min-width:0;flex:1;height:100%;border:0;background:transparent;font-size:12px}
    .omnibox input::placeholder{color:var(--muted-2)}
    .star{width:24px;height:24px;display:grid;place-items:center;border-radius:4px;color:var(--muted)}
    .star:hover{background:rgba(255,255,255,.07);color:var(--text)}
    .star.saved{color:#fff}

    .suggestions{
      position:absolute;
      left:0;
      right:0;
      top:41px;
      z-index:50;
      display:none;
      margin:0;
      padding:5px;
      list-style:none;
      background:#151519;
      border:1px solid var(--border-strong);
      border-radius:5px;
      box-shadow:0 22px 60px rgba(0,0,0,.45);
    }
    .suggestions.open{display:block}
    .suggestion{height:34px;padding:0 9px;display:flex;align-items:center;gap:8px;border-radius:4px;color:var(--muted);font-size:11px}
    .suggestion:hover,.suggestion.selected{background:var(--surface-2);color:var(--text)}
    .suggestion-type{margin-left:auto;color:var(--muted-2);font-size:8px}

    .view{position:relative;flex:1;min-height:0;overflow:hidden}

    .home{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:auto;scroll-behavior:smooth;
      background:radial-gradient(circle at 50% 42%,rgba(31,45,85,.12),transparent 36%);
    }

    .home-inner{width:min(670px,calc(100% - 40px));margin-top:-6vh;text-align:center}
    .logo{margin:0;font-family:Manrope Variable,sans-serif;font-size:64px;line-height:.93;letter-spacing:-.065em;font-weight:650;will-change:transform}
    .logo-line{height:3px;margin-top:14px;border-radius:999px;background:#fff;transform-origin:center;box-shadow:0 0 18px rgba(255,255,255,.15)}
    .home-search{margin-top:28px}
    .home-search-inner{
      height:52px;
      width:100%;
      padding:0 14px;
      display:flex;
      align-items:center;
      gap:8px;
      border:1px solid var(--border);
      border-radius:7px;
      background:var(--surface);
    }
    .home-search-inner:focus-within{background:var(--surface-2);border-color:var(--border-strong)}
    .home-search-inner input{min-width:0;flex:1;height:100%;background:none;border:0;font-size:14px}
    .home-search-inner input::placeholder{color:var(--muted-2)}

    .shortcuts{display:flex;justify-content:center;gap:5px;margin-top:12px;flex-wrap:wrap}
    .shortcut{padding:6px 9px;border:1px solid var(--border);background:rgba(255,255,255,.02);border-radius:999px;color:var(--muted);font-size:9px}
    .shortcut:hover{background:var(--surface-2);color:var(--text);border-color:var(--border-strong)}

    .warning{
      width:max-content;
      max-width:100%;
      margin:19px auto 0;
      display:flex;
      align-items:center;
      gap:7px;
      color:var(--muted-2);
      font-size:9px;
    }

    .results{position:absolute;inset:0;display:none;overflow:auto;scroll-behavior:smooth;padding:26px 28px 50px;background:#000}
    .results.visible{display:block}
    .results-inner{width:min(820px,100%);margin:0 auto}
    .results-header{display:flex;gap:8px;align-items:center;margin-bottom:12px}
    .results-query{font-size:13px;font-weight:650}
    .results-meta{font-size:9px;color:var(--muted-2)}
    .result{display:block;margin-bottom:7px;padding:13px;border:1px solid var(--border);border-radius:6px;background:rgba(12,12,15,.68)}
    .result:hover{background:var(--surface-2);border-color:var(--border-strong)}
    .result-url{font-size:9px;color:#777780;margin-bottom:5px;overflow-wrap:anywhere}
    .result-title{font-size:13px;font-weight:650;margin-bottom:5px}
    .result-desc{font-size:10px;line-height:1.55;color:var(--muted)}
    .results-empty{padding:35px;text-align:center;color:var(--muted);font-size:10px}

    .web-view{position:absolute;inset:0;display:none;background:#fff}
    .web-view.visible{display:block}
    .frame{display:block;width:100%;height:100%;border:0;background:#fff}
    .source{position:absolute;inset:0;display:none;overflow:auto;scroll-behavior:smooth;margin:0;padding:18px;background:#0c0d11;color:#b9f5c8;font:12px/1.55 Consolas,Monaco,SFMono-Regular,monospace;white-space:pre-wrap}

    .loading{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:10;background:rgba(0,0,0,.28);backdrop-filter:blur(5px)}
    .loading.visible{display:flex}
    .loading-ring{width:26px;height:26px;border:2px solid rgba(255,255,255,.12);border-top-color:#fff;border-radius:50%}

    .result-types{margin-left:auto;display:flex;gap:2px;padding:2px;border:1px solid var(--border);border-radius:5px;background:rgba(255,255,255,.02)}
    .result-type{position:relative;height:25px;padding:0 8px;border-radius:4px;color:var(--muted);font-size:9px;overflow:hidden}
    .result-type:hover{color:var(--text)}
    .result-type.active{color:var(--text)}
    .result-type-highlight{position:absolute;inset:0;border-radius:4px;background:var(--surface-3);z-index:0}
    .result-type-label{position:relative;z-index:1}
    .result-thumb{float:right;width:68px;height:50px;margin:0 0 7px 12px;border-radius:5px;object-fit:cover;background:#0c0c0f;border:1px solid var(--border)}
    .shopping-meta{margin-bottom:5px;color:#d5d5da;font-size:10px}
    .result-age{margin-top:6px;color:var(--muted-2);font-size:9px}
    .image-results{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
    .image-result{display:block;overflow:hidden;border:1px solid var(--border);border-radius:6px;background:rgba(12,12,15,.68)}
    .image-result:hover{border-color:var(--border-strong);background:var(--surface-2)}
    .image-result img{display:block;width:100%;aspect-ratio:1.28;object-fit:cover;background:#101014}
    .image-result-copy{padding:8px}
    .image-result-copy .result-title{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px;font-size:10px}
    .settings-backdrop{position:fixed;inset:0;z-index:180;background:rgba(0,0,0,.52);backdrop-filter:blur(12px) saturate(1.08);display:grid;place-items:stretch}
    .settings-panel{width:100%;height:100%;padding:22px 26px 28px;background:color-mix(in srgb,var(--bg) 88%,var(--surface) 12%);border:0;box-shadow:none;overflow:auto;scroll-behavior:smooth}
    .settings-shell{width:min(1120px,100%);min-height:100%;margin:0 auto}
    .settings-header{position:sticky;top:0;z-index:3;height:58px;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
    .settings-title-wrap{display:flex;align-items:center;gap:12px}
    .settings-title{font-size:18px;font-weight:700;letter-spacing:-.03em}
    .settings-subtitle{color:var(--muted-2);font-size:10px}
    .settings-close{width:34px;height:34px;border:1px solid var(--border);border-radius:8px;background:var(--surface);display:grid;place-items:center;color:var(--muted)}
    .settings-close:hover{color:var(--text);background:var(--surface-2);border-color:var(--border-strong)}
    .settings-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.65fr);gap:14px;align-items:start;padding-bottom:20px}
    .settings-card{padding:15px;border:1px solid var(--border);border-radius:12px;background:color-mix(in srgb,var(--surface) 92%,transparent);box-shadow:0 18px 70px rgba(0,0,0,.12)}
    .settings-card + .settings-card{margin-top:14px}
    .settings-card-title{font-size:11px;font-weight:700;margin-bottom:2px}
    .settings-card-copy{color:var(--muted-2);font-size:9px;line-height:1.5;margin-bottom:12px}
    .settings-section{padding:13px 0;border-top:1px solid var(--border)}
    .settings-section:first-child{padding-top:0;border-top:0}
    .settings-label{margin-bottom:9px;color:var(--muted-2);font-size:9px;text-transform:uppercase;letter-spacing:.1em}
    .settings-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
    .settings-option{height:38px;border:1px solid var(--border);border-radius:7px;color:var(--muted);font-size:10px;background:rgba(255,255,255,.02);transition:background .2s var(--ease),border-color .2s var(--ease),transform .2s var(--ease)}
    .settings-option:hover{background:var(--surface-2);border-color:var(--border-strong)}
    .settings-option.active{background:var(--surface-3);color:var(--text);border-color:var(--border-strong);box-shadow:inset 0 0 0 1px rgba(255,255,255,.03)}
    .switch-row{width:100%;height:42px;padding:0 11px;display:flex;align-items:center;justify-content:space-between;border:1px solid var(--border);border-radius:7px;background:rgba(255,255,255,.02);font-size:10px;color:var(--text);transition:background .2s var(--ease),border-color .2s var(--ease)}
    .switch-row:hover{background:var(--surface-2);border-color:var(--border-strong)}
    .switch{width:28px;height:16px;border-radius:999px;background:#2a2a30;padding:2px;transition:background .18s ease}
    .switch span{display:block;width:12px;height:12px;border-radius:50%;background:#777780;transition:transform .18s var(--ease),background .18s ease}
    .switch.on{background:#eee}
    .switch.on span{transform:translateX(12px);background:#111}
    .bookmark-list{display:flex;flex-direction:column;gap:3px}
    .bookmark-list-item{min-height:32px;padding:0 9px;display:flex;align-items:center;justify-content:space-between;border-radius:5px;color:var(--muted);font-size:10px;text-align:left}
    .bookmark-list-item:hover{background:var(--surface-2);color:var(--text)}
    .settings-muted,.settings-note{color:var(--muted-2);font-size:9px;line-height:1.5}

    .toast{position:fixed;right:14px;bottom:14px;z-index:100;max-width:340px;padding:11px 13px;border:1px solid var(--border-strong);background:rgba(20,20,24,.94);backdrop-filter:blur(18px);border-radius:6px;color:var(--muted);font-size:10px;box-shadow:0 16px 50px rgba(0,0,0,.45)}
    .toast strong{display:block;color:var(--text);margin-bottom:3px}

    #idx-container{
      position:fixed!important;
      left:0!important;
      top:0!important;
      width:1px!important;
      height:1px!important;
      overflow:hidden!important;
      opacity:0.001!important;
      pointer-events:none!important;
      z-index:-1!important;
      transform:translateZ(0);
    }

    .theme-option{position:relative;display:flex;align-items:center;gap:8px;text-align:left;padding:0 10px}
    .theme-swatch{width:18px;height:18px;border-radius:5px;border:1px solid rgba(255,255,255,.14);flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
    .settings-preview{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
    .settings-preview-box{height:92px;border:1px solid var(--border);border-radius:9px;background:var(--surface);padding:9px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
    .settings-preview-bar{height:7px;width:55%;border-radius:999px;background:var(--border-strong)}
    .settings-preview-line{height:5px;width:82%;border-radius:999px;background:var(--border)}
    .settings-preview-line.short{width:58%}
    .cursor-ring{position:fixed;left:0;top:0;width:18px;height:18px;margin:-9px 0 0 -9px;border:1px solid color-mix(in srgb,var(--text) 72%,transparent);border-radius:50%;pointer-events:none;z-index:1000;mix-blend-mode:difference;will-change:transform;box-shadow:0 0 18px rgba(255,255,255,.06)}
    .smooth-caret{position:fixed;left:0;top:0;width:2px;height:1.1em;border-radius:999px;background:var(--text);pointer-events:none;z-index:1001;opacity:0;transform-origin:center;will-change:transform,height,opacity;box-shadow:0 0 7px color-mix(in srgb,var(--text) 22%,transparent);animation:proxus-caret-blink 1.05s steps(1,end) infinite}
    .smooth-caret.visible{opacity:1}
    @keyframes proxus-caret-blink{0%,48%{opacity:1}49%,100%{opacity:.12}}
    html.proxus-custom-cursor,html.proxus-custom-cursor body,html.proxus-custom-cursor body *{cursor:none!important}
    html.proxus-smooth-caret input:not([type="button"]):not([type="submit"]),html.proxus-smooth-caret textarea{caret-color:transparent!important}
    body[data-theme=ash]{--bg:#0b0c0f;--surface:rgba(24,25,29,.78);--surface-2:rgba(31,32,37,.84);--surface-3:rgba(42,43,49,.9);--text:#f2f3f5;--muted:#9ca0a8;--muted-2:#686d76;--border:rgba(255,255,255,.1);--border-strong:rgba(255,255,255,.18)}
    body[data-theme=frost]{--bg:#071018;--surface:rgba(15,27,38,.8);--surface-2:rgba(20,36,50,.86);--surface-3:rgba(26,46,63,.92);--text:#ecf7ff;--muted:#9db2c2;--muted-2:#627789;--border:rgba(192,226,255,.12);--border-strong:rgba(192,226,255,.22)}
    body[data-theme=ocean]{--bg:#071017;--surface:rgba(9,29,39,.8);--surface-2:rgba(12,41,54,.86);--surface-3:rgba(16,56,72,.92);--text:#eafcff;--muted:#95b6bf;--muted-2:#5f7b84;--border:rgba(121,226,245,.12);--border-strong:rgba(121,226,245,.22)}

          speed:.028+Math.random()*.12,
          drift:(Math.random()-.5)*.025,

      });

      doc.querySelectorAll("img[srcset],source[srcset],link[imagesrcset],img[data-srcset],source[data-srcset]").forEach(node=>{
        const attr=node.hasAttribute('data-srcset')?'data-srcset':(node.hasAttribute('imagesrcset')?'imagesrcset':'srcset');
        const original=node.getAttribute(attr)||"";
        const absoluteSet=original.split(',').map(part=>{
          const bits=part.trim().split(/\s+/);
          if(!bits[0] || isSpecialUrl(bits[0]))return part.trim();
          const absolute=resolveNavigation(bits[0],pageUrl);
          if(!absolute || !/^https?:\/\//i.test(absolute))return part.trim();
          bits[0]=absolute;
          return bits.join(' ');
        }).filter(Boolean).join(', ');
        if(absoluteSet)node.setAttribute(attr,absoluteSet);
        node.setAttribute('data-proxus-original-srcset',original);
        node.setAttribute('data-proxus-relay-srcset',original.split(',').map(part=>{
          const bits=part.trim().split(/\s+/); if(!bits[0])return part.trim();
          const absolute=resolveNavigation(bits[0],pageUrl); bits[0]=absolute&&/^https?:\/\//i.test(absolute)?proxyAsset(absolute):bits[0];
          return bits.join(' ');
        }).filter(Boolean).join(', '));
      });

      const rewriteCssUrls=(css,base)=>String(css||"").replace(/url\(\s*(["']?)([^"')]+)\1\s*\)/gi,(full,quote,target)=>{
        if(isSpecialUrl(target)||isProxyUrl(target))return full;
        const absolute=resolveNavigation(target,base);
        return absolute && /^https?:\/\//i.test(absolute) ? `url("${proxyAsset(absolute)}")` : full;
      });

      doc.querySelectorAll('style').forEach(style=>style.textContent=rewriteCssUrls(style.textContent,pageUrl));
      doc.querySelectorAll('[style]').forEach(node=>node.setAttribute('style',rewriteCssUrls(node.getAttribute('style'),pageUrl)));

      let baseNode=doc.querySelector('base');
      if(!baseNode){
        baseNode=doc.createElement('base');
        doc.head ? doc.head.prepend(baseNode) : doc.documentElement.prepend(baseNode);
      }
      baseNode.setAttribute('href',pageUrl);

      const bridge=doc.createElement('script');
      bridge.textContent=`(()=>{
        const __PROXUS_PAGE=${JSON.stringify(pageUrl)};
        const __PROXUS_PROXY=${JSON.stringify(SUPABASE_PROXY)};
        const __asset=(u)=>__PROXUS_PROXY+'?asset=1&url='+encodeURIComponent(u);
        const __page=(input)=>{try{return new URL(String(input),__PROXUS_PAGE).href}catch{return String(input)}};
        const __http=(u)=>/^https?:$/i.test(new URL(u).protocol);
        const __retryAttr=(el,attr)=>{
          const relay=el.getAttribute('data-proxus-relay-'+attr.replace(/[^a-z0-9]+/gi,'-'));
          const original=el.getAttribute('data-proxus-original-'+attr.replace(/[^a-z0-9]+/gi,'-'));
          if(el.getAttribute('data-proxus-tried-fallback')==='1')return;
          el.setAttribute('data-proxus-tried-fallback','1');
          if(original) el.setAttribute(attr,original); else if(relay) el.setAttribute(attr,relay);
        };
        const __prepareAsset=(el)=>{
          if(!el || el.nodeType!==1)return;
          for(const attr of ['src','poster','data','data-src','data-lazy-src','data-original','data-url']){
            const raw=el.getAttribute(attr);
            if(!raw || /^(?:data:|blob:|javascript:|about:)/i.test(raw))continue;
            const key=attr.replace(/[^a-z0-9]+/gi,'-');
            let abs=''; try{abs=__page(raw)}catch{}
            if(!/^https?:\/\//i.test(abs))continue;
            if(!el.getAttribute('data-proxus-original-'+key))el.setAttribute('data-proxus-original-'+key,abs);
            if(!el.getAttribute('data-proxus-relay-'+key))el.setAttribute('data-proxus-relay-'+key,__asset(abs));
            const tag=String(el.tagName||'').toLowerCase();
            if((tag==='img'||tag==='source'||(tag==='video'&&attr==='poster')) && raw!==abs)el.setAttribute(attr,abs);
            const original=el.getAttribute('data-proxus-original-'+key);
            const relay=el.getAttribute('data-proxus-relay-'+key);
            if(original && relay && el.getAttribute('data-proxus-hook-'+key)!=='1'){
              el.setAttribute('data-proxus-hook-'+key,'1');
              el.addEventListener('error',()=>{
                if(el.getAttribute('data-proxus-used-relay-'+key)==='1')return;
                el.setAttribute('data-proxus-used-relay-'+key,'1');
                el.setAttribute(attr,relay);
              },true);
            }
          }
          const srcsetAttr=el.hasAttribute('srcset')?'srcset':(el.hasAttribute('data-srcset')?'data-srcset':(el.hasAttribute('imagesrcset')?'imagesrcset':null));
          if(srcsetAttr){
            const rawSet=el.getAttribute(srcsetAttr)||'';
            const directSet=rawSet.split(',').map(part=>{
              const bits=part.trim().split(/\s+/); if(!bits[0])return '';
              try{const abs=__page(bits[0]); if(!/^https?:\/\//i.test(abs))return part.trim(); bits[0]=abs; return bits.join(' ')}catch{return part.trim()}
            }).filter(Boolean).join(', ');
            const relaySet=directSet.split(',').map(part=>{
              const bits=part.trim().split(/\s+/); if(!bits[0])return '';
              return [__asset(bits[0]),...bits.slice(1)].join(' ');
            }).filter(Boolean).join(', ');
            el.setAttribute(srcsetAttr,directSet);
            el.setAttribute('data-proxus-relay-srcset',relaySet);
            if(el.getAttribute('data-proxus-srcset-hook')!=='1'){
              el.setAttribute('data-proxus-srcset-hook','1');
              el.addEventListener('error',()=>{
                if(el.getAttribute('data-proxus-used-relay-srcset')==='1')return;
                el.setAttribute('data-proxus-used-relay-srcset','1');
                el.setAttribute(srcsetAttr,relaySet);
              },true);
            }
          }
        };

        document.querySelectorAll('img,source,video,object,embed').forEach(__prepareAsset);
        const __assetObserver=new MutationObserver(records=>{
          for(const r of records){
            if(r.type==='attributes')__prepareAsset(r.target);
            for(const n of r.addedNodes||[]){
              if(n.nodeType!==1)continue;
              __prepareAsset(n);
              n.querySelectorAll?.('img,source,video,object,embed').forEach(__prepareAsset);
            }
          }
        });
        try{__assetObserver.observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['src','srcset','poster','data-src','data-srcset','data-lazy-src','data-original','data-url']});}catch{}

        const __testBackgrounds=()=>document.querySelectorAll('[style]').forEach(el=>{
          const style=el.getAttribute('style')||'';
          for(const match of style.matchAll(/url\(\s*["']?([^"')]+)["']?\s*\)/gi)){
            const original=match[1]; if(!/^https?:\/\//i.test(original))continue;
            const test=new Image();
            test.onerror=()=>{const relay=__asset(original); const cur=el.getAttribute('style')||''; el.setAttribute('style',cur.split(original).join(relay));};
            test.src=original;
          }
        });
        __testBackgrounds();

        // Route site network traffic through the relay first. This keeps API
        // calls, images, modules, and POST bodies in the same proxied origin.
        // Direct access is only a fallback when the relay itself fails.
        const __fetch=window.fetch.bind(window);
        window.fetch=async function(input,init){
          let raw=''; try{raw=typeof input==='string'?input:input?.url||''}catch{}
          let u=''; try{u=__page(raw)}catch{}
          if(__http(u) && !u.startsWith(__PROXUS_PROXY)){
            const relay=__asset(u);
            try{
              const proxiedInput=typeof input==='string' ? relay : (input instanceof Request ? new Request(relay,input) : relay);
              const proxied=await __fetch.call(this,proxiedInput,init);
              if(proxied.ok || (proxied.status>=200 && proxied.status<400) || proxied.status===304)return proxied;
            }catch{}
            try{ return await __fetch.call(this,input,init); }catch{}
          }
          return __fetch.call(this,input,init);
        };

        try{
          const __sendBeacon=navigator.sendBeacon?.bind(navigator);
          if(__sendBeacon){
            navigator.sendBeacon=function(url,data){
              try{const abs=__page(url); if(__http(abs)) return __sendBeacon(__asset(abs),data);}catch{}
              return __sendBeacon(url,data);
            };
          }
        }catch{}

        try{
          const __NativeEventSource=window.EventSource;
          if(__NativeEventSource){
            window.EventSource=function(url,opts){
              let abs=String(url); try{abs=__page(url)}catch{}
              return new __NativeEventSource(__http(abs)?__asset(abs):url,opts);
            };
            window.EventSource.prototype=__NativeEventSource.prototype;
          }
        }catch{}


        try{
          const __NativeXHR=window.XMLHttpRequest;
          const __open=__NativeXHR.prototype.open;
          __NativeXHR.prototype.open=function(method,url){
            let abs=String(url); try{abs=__page(url)}catch{}
            const next=__http(abs)&&!abs.startsWith(__PROXUS_PROXY)?__asset(abs):url;
            return __open.apply(this,[method,next].concat([].slice.call(arguments,2)));
          };
        }catch{}

        try{
          const __push=history.pushState.bind(history);
          history.pushState=function(state,title,url){
            __push(state,title,url);
            if(url)parent.postMessage({type:'360-navigate',url:__page(url)},'*');
          };
          const __replace=history.replaceState.bind(history);
          history.replaceState=function(state,title,url){
            __replace(state,title,url);
            if(url)parent.postMessage({type:'360-navigate',url:__page(url)},'*');
          };
          window.addEventListener('popstate',()=>parent.postMessage({type:'360-navigate',url:__page(location.href)},'*'));
        }catch{}

        // Forms and normal links are sent back through the outer viewer so they
        // can be fetched against the real origin URL, never about:srcdoc.
        document.addEventListener('click',e=>{
          const a=e.target?.closest?.('a[href]'); if(!a)return;
          const raw=a.getAttribute('href'); if(!raw || /^(?:#|javascript:|mailto:|tel:|data:|blob:)/i.test(raw))return;
          try{const u=new URL(raw,__PROXUS_PAGE); if(__http(u.href)){e.preventDefault();e.stopPropagation();parent.postMessage({type:'360-navigate',url:u.href},'*');}}catch{}
        },true);
        document.addEventListener('submit',e=>{
          const form=e.target; if(!form?.action)return;
          try{const u=new URL(form.action,__PROXUS_PAGE); if(__http(u.href) && String(form.method||'get').toLowerCase()==='get'){e.preventDefault();e.stopPropagation();parent.postMessage({type:'360-navigate',url:u.href},'*');}}catch{}
        },true);
      })();`;
      doc.head ? doc.head.prepend(bridge) : doc.documentElement.prepend(bridge);
      return '<!doctype html>\n'+doc.documentElement.outerHTML;
    }catch{return html;}
  }

  async function fetchOfficialSearch(q,type,safe,limit=50,page=1){
    const params=new URLSearchParams({
      q:String(q||'').slice(0,500),
      type,
      safe:safe?'moderate':'off',
      limit:String(Math.min(100,Math.max(1,limit))),
      page:String(Math.min(100,Math.max(1,page)))
    });

    const target=SEARCH_API+'?'+params.toString();
    let response=null;

    try{
      const direct=await fetch(target,{method:'GET',headers:{Accept:'application/json'}});
      if(direct.ok && /json/i.test(direct.headers.get('content-type')||''))response=direct;
    }catch{}

    if(!response){
      response=await fetch(proxyAsset(target),{method:'GET',headers:{Accept:'application/json'}});
    }

    if(!response.ok){
      throw new Error('Search request failed ('+response.status+')');
    }

    const data=await response.json();
    return {
      ...data,
      results:Array.isArray(data?.results)?data.results:[]
    };
  }

  function App(){
    const [tabs,setTabs]=useStorage("proxus-tabs",[{id:"home",title:"New Tab",url:"",history:[],historyIndex:-1}]);
    const [activeId,setActiveId]=useStorage("proxus-active","home");
    const [bookmarks,setBookmarks]=useStorage("proxus-bookmarks",[]);
    const [collapsed,setCollapsed]=useStorage("proxus-collapsed",false);
    const [mobileOpen,setMobileOpen]=useState(false);
    const [homeQuery,setHomeQuery]=useState("");
    const [query,setQuery]=useState("");
    const [results,setResults]=useState([]);
    const [showResults,setShowResults]=useState(false);
    const [loading,setLoading]=useState(false);
    const [currentUrl,setCurrentUrl]=useState("");
    const [rawHtml,setRawHtml]=useState("");
    const [sourceMode,setSourceMode]=useState(false);
    const [frameHtml,setFrameHtml]=useState("");
    const [searchType,setSearchType]=useState("web");
    const [safeSearch,setSafeSearch]=useState(true);
    const [dustEnabled,setDustEnabled]=useState(true);
    const [settingsOpen,setSettingsOpen]=useState(false);
    const [theme,setTheme]=useStorage("proxus-theme","obsidian");
    const [customCursor,setCustomCursor]=useStorage("proxus-custom-cursor",false);
    const [smoothCaret,setSmoothCaret]=useStorage("proxus-smooth-caret",true);
    const [suggestions,setSuggestions]=useState([]);
    const [suggestionIndex,setSuggestionIndex]=useState(-1);
    const [toast,setToast]=useState(null);
    const [vpnOpen,setVpnOpen]=useState(false);
    const frameRef=useRef(null);
    const suggestTimer=useRef(null);

    useEffect(()=>{
      document.body.dataset.theme=theme||"obsidian";
      return()=>{delete document.body.dataset.theme};
    },[theme]);

    useEffect(()=>{
      document.documentElement.classList.toggle("proxus-custom-cursor",!!customCursor);
      document.documentElement.classList.toggle("proxus-smooth-caret",!!smoothCaret);
      return()=>{
        document.documentElement.classList.remove("proxus-custom-cursor","proxus-smooth-caret");
      };
    },[customCursor,smoothCaret]);

    const activeTab=useMemo(()=>tabs.find(t=>t.id===activeId)||tabs[0],[tabs,activeId]);
    const currentTab=()=>activeTab;

    const showToast=(title,message)=>{
      setToast({title,message});
      setTimeout(()=>setToast(null),2800);
    };

    const setUrl=(url)=>{
      setCurrentUrl(url);
      setQuery(url);
      setHomeQuery(url);
    };

    const updateTab=(url,title,targetTabId=activeId)=>{
      setTabs(prev=>prev.map(t=>t.id===targetTabId?{...t,url,title:title||t.title||"New Tab"}:t));
    };

    const applyFrameCursor=(html)=>{
      if(!html)return html;
      const marker="<style id=\"__proxus_cursor__\">";
      const css=`${marker}${customCursor?"html,body,html *,body *{cursor:none!important}":""}</style>`;
      return html.replace(/<style id=\"__proxus_cursor__\">[\s\S]*?<\/style>/i,"").replace(/<\/head>/i,css+"</head>");
    };

    const showHome=(targetTabId=activeId)=>{
      setShowResults(false);
      setSourceMode(false);
      setCurrentUrl("");
      setQuery("");
      setHomeQuery("");
      setTabs(prev=>prev.map(t=>t.id===targetTabId?{...t,url:"",title:"New Tab",history:[],historyIndex:-1}:t));
    };

    const fetchPage=async(url,method="get",pushHistory=true,targetTabId=activeId)=>{
      const resolvedUrl=resolveNavigation(url,currentUrl);
      if(!resolvedUrl)return;

      setLoading(true);
      try{
        const response=await fetch(proxify(resolvedUrl),{method:method==="post"?"POST":"GET"});
        if(!response.ok)throw new Error("Server responded with "+response.status);
        const sourceHtml=await response.text();
        const finalUrl=resolveNavigation(response.headers.get("X-Final-Url")||resolvedUrl,resolvedUrl);
        const html=rewritePageForSrcdoc(sourceHtml,finalUrl);
        if(pushHistory){
          setTabs(prev=>prev.map(t=>{
            if(t.id!==targetTabId)return t;
            const history=Array.isArray(t.history)?t.history:[];
            const index=Number.isInteger(t.historyIndex)?t.historyIndex:-1;
            const nextHistory=history.slice(0,index+1);
            if(nextHistory[nextHistory.length-1]!==finalUrl)nextHistory.push(finalUrl);
            return {...t,history:nextHistory,historyIndex:nextHistory.length-1};
          }));
        }
        setRawHtml(html);
        setUrl(finalUrl);
        let title="";
        try{title=(new URL(finalUrl)).hostname}catch{}
        updateTab(finalUrl,title,targetTabId);
        setShowResults(false);
        setFrameHtml(applyFrameCursor(html));
      }catch(err){
        showToast("Could not load page",err.message);
      }finally{
        setLoading(false);
      }
    };

    useEffect(()=>{
      if(rawHtml && currentUrl)setFrameHtml(applyFrameCursor(rawHtml));
    },[customCursor]);

    const navigate=(value)=>{
      const raw=String(value||"").trim();
      if(!raw)return;
      setSuggestions([]);
      setSuggestionIndex(-1);
      const url=normalizeUrl(raw);
      if(url){
        fetchPage(url);
        return;
      }
      search(raw);
    };

    const search=async(q,type=searchType)=>{
      const value=String(q||'').trim().slice(0,500);
      if(!value)return;

      setLoading(true);
      setShowResults(true);
      setQuery(value);
      setResults([]);

      try{
        if(type==='web'){
          const [gsc,official]=await Promise.allSettled([
            triggerGcse(value,'web'),
            fetchOfficialSearch(value,'web',safeSearch,50,1)
          ]);

          const gscResults=gsc.status==='fulfilled'?gsc.value:[];
          const officialResults=official.status==='fulfilled'?official.value.results:[];

          const normalizedOfficial=officialResults.map(item=>({
            ...item,
            description:item.description||item.desc||'',
            source:item.source||cleanHost(item.url||item.link),
            thumbnail:item.thumbnail||item.thumb||''
          }));

          setResults(mergeSearchResults(gscResults,normalizedOfficial));

          if(!gscResults.length && !normalizedOfficial.length)throw new Error('No search results returned');
        }else if(type==='image'){
          const [gsc,official]=await Promise.allSettled([
            triggerGcse(value,'image'),
            fetchOfficialSearch(value,'image',safeSearch,50,1)
          ]);

          const gscResults=(gsc.status==='fulfilled'?gsc.value:[]).filter(item=>item.image||item.thumbnail);
          const officialResults=official.status==='fulfilled'?official.value.results:[];
          const normalizedOfficial=officialResults.map(item=>({
            ...item,
            image:item.image||item.thumbnail||item.url||'',
            thumbnail:item.thumbnail||item.image||''
          }));
          const merged=mergeSearchResults(gscResults,normalizedOfficial);
          setResults(merged);
          if(!merged.length)throw new Error('No image results returned');
        }else if(type==='news'){
          const data=await fetchOfficialSearch(value,'news',safeSearch,50,1);
          setResults(data.results.map(item=>({
            ...item,
            description:item.description||item.desc||item.snippet||'',
            source:item.source||cleanHost(item.url||item.link),
            thumbnail:item.thumbnail||item.image||item.thumb||'',
            age:item.age||item.published||item.date||''
          })));
        }else{
          const data=await fetchOfficialSearch(value,type,safeSearch,50,1);
          setResults(data.results);
        }
      }catch(err){
        showToast('Search unavailable',err.message);
      }finally{
        setLoading(false);
      }
    };
    useEffect(()=>{
      if(!query || query.length<2 || normalizeUrl(query)){
        setSuggestions([]);
        setSuggestionIndex(-1);
        return;
      }

      clearTimeout(suggestTimer.current);
      suggestTimer.current=setTimeout(async()=>{
        try{
          const data=await fetchOfficialSearch(query,'web',safeSearch,5,1);
          setSuggestions(data.results.slice(0,5));
          setSuggestionIndex(-1);
        }catch{
          setSuggestions([]);
        }
      },220);

      return()=>clearTimeout(suggestTimer.current);
    },[query,safeSearch]);

    const createTab=()=>{
      const tab={id:(crypto.randomUUID ? crypto.randomUUID() : "px-"+Date.now().toString(36)+Math.random().toString(36).slice(2,8)),title:"New Tab",url:"",history:[],historyIndex:-1};
      setTabs(prev=>[...prev,tab]);
      setActiveId(tab.id);
      setCurrentUrl("");
      setQuery("");
      setHomeQuery("");
      setShowResults(false);
      setMobileOpen(false);
    };

    const closeTab=(id)=>{
      if(tabs.length<=1){
        showHome();
        return;
      }
      const index=tabs.findIndex(t=>t.id===id);
      const next=tabs[index+1]||tabs[index-1];
      setTabs(prev=>prev.filter(t=>t.id!==id));
      if(id===activeId){
        setActiveId(next.id);
        if(next.url)fetchPage(next.url,"get",false,next.id);else showHome(next.id);
      }
    };

    const goTab=(tab)=>{
      setActiveId(tab.id);
      if(tab.url)fetchPage(tab.url,"get",false,tab.id);else showHome(tab.id);
      setMobileOpen(false);
    };

    const goHistory=(direction)=>{
      const tab=currentTab();
      if(!tab)return;
      const history=Array.isArray(tab.history)?tab.history:[];
      let index=Number.isInteger(tab.historyIndex)?tab.historyIndex:-1;
      const next=index+direction;
      if(next<0||next>=history.length)return;
      const target=history[next];
      setTabs(prev=>prev.map(t=>t.id===activeId?{...t,historyIndex:next}:t));
      fetchPage(target,"get",false);
    };

    const reload=()=>{
      if(currentUrl)fetchPage(currentUrl,"get",false);
    };

    const toggleBookmark=()=>{
      if(!currentUrl)return showToast("Nothing to bookmark","Open a page first.");
      const exists=bookmarks.some(b=>b.url===currentUrl);
      if(exists){
        setBookmarks(bookmarks.filter(b=>b.url!==currentUrl));
        showToast("Bookmark removed",currentUrl);
      }else{
        setBookmarks([...bookmarks,{url:currentUrl,title:activeTab?.title||currentUrl}]);
        showToast("Bookmark saved",currentUrl);
      }
    };

    useEffect(()=>{
      const onMessage=(event)=>{
        if(frameRef.current && event.source !== frameRef.current.contentWindow)return;
        const data=event.data;
        if(!data||typeof data!=="object")return;
        if(data.type==="360-navigate"&&data.url)fetchPage(resolveNavigation(data.url,currentUrl),data.method);
        if(data.type==="360-meta"&&data.url){
          const metaUrl=resolveNavigation(data.url,currentUrl);
          setUrl(metaUrl);
          setTabs(prev=>prev.map(t=>{
            if(t.id!==activeId)return t;
            const history=Array.isArray(t.history)?t.history:[];
            const index=Number.isInteger(t.historyIndex)?t.historyIndex:-1;
            const current=history[index];
            if(current===metaUrl)return {...t,url:metaUrl};
            const nextHistory=history.slice(0,index+1);
            nextHistory.push(metaUrl);
            return {...t,url:metaUrl,history:nextHistory,historyIndex:nextHistory.length-1};
          }));
        }
        if(data.type==="360-alert"&&typeof data.msg==="string")alert(data.msg);
        if(data.type==="360-confirm"&&typeof data.msg==="string")confirm(data.msg);
        if(data.type==="360-prompt"&&typeof data.msg==="string")prompt(data.msg,data.def);
      };
      addEventListener("message",onMessage);
      return()=>removeEventListener("message",onMessage);
    },[activeId,activeTab?.title,currentUrl]);

    useEffect(()=>{
      const frame=frameRef.current;
      if(!frame)return;


      const onLoad=()=>{
        try{
          const href=frame.contentWindow?.location?.href || "";
          if(href && href!=="about:srcdoc" && href!=="about:blank" && /^https?:\/\//i.test(href)){
            const tab=currentTab();
            if(tab && href!==currentUrl){
              fetchPage(href,"get",true,tab.id);
            }
          }
        }catch{}
      };

      frame.addEventListener("load",onLoad);
      return()=>frame.removeEventListener("load",onLoad);
    },[currentUrl,activeId]);

    useEffect(()=>{
      if(!tabs.length){
        const tab={id:(crypto.randomUUID ? crypto.randomUUID() : "px-"+Date.now().toString(36)+Math.random().toString(36).slice(2,8)),title:"New Tab",url:"",history:[],historyIndex:-1};
        setTabs([tab]);
        setActiveId(tab.id);
        return;
      }
      if(!tabs.some(t=>t.id===activeId))setActiveId(tabs[0].id);
    },[]);

    const initialLoadRef=useRef(false);
    useEffect(()=>{
      if(initialLoadRef.current)return;
      initialLoadRef.current=true;
      if(activeTab?.url)fetchPage(activeTab.url,"get",false,activeTab.id);
    },[]);

    const submitHome=(e)=>{e.preventDefault();navigate(homeQuery)};
    const submitOmni=(e)=>{e.preventDefault();navigate(query)};

    const activeBookmarked=bookmarks.some(b=>b.url===currentUrl);

    const sidebarNode = h(
      motion.aside,
      {
        className: "sidebar" + (mobileOpen ? " mobile-open" : ""),
        animate: {width: collapsed ? 56 : 240},
        transition: {type:"spring", stiffness:280, damping:28, mass:.72}
      },
      h("div", {className:"sidebar-inner"},
        h("div", {className:"brand"},
          h(motion.div, {
            className:"brand-mark",
            whileHover:{rotate:-4,scale:1.04},
            whileTap:{scale:.95}
          }, "PX"),
          !collapsed && h(motion.div, {
            className:"brand-copy",
            initial:{opacity:0,x:-7},
            animate:{opacity:1,x:0},
            exit:{opacity:0,x:-7},
            transition:{type:"spring",stiffness:380,damping:28}
          },
            h("div", {className:"brand-name"}, "PROXUS"),
          )
        ),
        !collapsed && h("form", {
          className:"side-search",
          onSubmit:e=>{e.preventDefault();navigate(query)}
        },
          h(Icon, {name:"search",size:14}),
          h("input", {value:query,onChange:e=>setQuery(e.target.value),placeholder:"Search or enter URL"})
        ),
        !collapsed && h("div", {className:"bookmarks"},
          [
            ["360","https://360-search.com"],
            ["GitHub","https://github.com"],
            ["MDN","https://developer.mozilla.org"]

              key:label,
              className:"bookmark",
              whileHover:{y:-1,scale:1.015},
              whileTap:{scale:.97},
              onClick:()=>fetchPage(url)

          )
        ),
        h(motion.button, {
          className:"new-tab",
          onClick:createTab,
          whileHover:{x:2},
          whileTap:{scale:.98}
        },
          h(Icon,{name:"plus",size:15}),
          !collapsed && h("span",null,"New tab")
        ),
        h("ul", {className:"tab-list"},
          tabs.map(tab=>
            h(motion.li, {
              key:tab.id,
              className:"tab"+(tab.id===activeId?" active":""),
              onClick:()=>goTab(tab),
              layout:true,
              whileHover:{x:2},
              transition:{type:"spring",stiffness:400,damping:28}
            },
              tab.id===activeId && h(motion.div, {

          )
        ),
        h("div", {className:"side-bottom"},
          h(motion.button, {
            className:"side-button",
            whileHover:{x:2},
            onClick:()=>setCollapsed(v=>!v)
          },
            h(Icon,{name:"panel",size:15}),
            !collapsed && h("span",null,"Collapse")
          ),
          !collapsed && h(motion.button, {
            className:"side-button",
            whileHover:{x:2},
            onClick:()=>setSettingsOpen(true)
          },
            h(Icon,{name:"settings",size:15}),
            h("span",null,"Settings")
          ),
          !collapsed && h(motion.button, {
            className:"side-button",
            whileHover:{x:2},
            onClick:()=>showToast("PROXUS","Authorized access only.")
          },
            h(Icon,{name:"info",size:15}),
            h("span",null,"About")
          )
        )
      )
    );

    const toolbarNode = h(
      "header",
      {className:"toolbar"},
      h(motion.button, {
        className:"icon-button mobile-menu",
        whileTap:{scale:.9},
        onClick:()=>setMobileOpen(v=>!v)

      h("div", {className:"toolbar-actions"},

        ),
        vpnOpen && h(motion.div,{className:"vpn-menu",initial:{opacity:0,y:-6,scale:.97},animate:{opacity:1,y:0,scale:1},exit:{opacity:0,y:-4,scale:.985},transition:{type:"spring",stiffness:430,damping:30}},
          h("div",{className:"vpn-menu-row"},h("span",null,"Private route"),h("strong",null,"On")),

        )
      ),
      h("div", {className:"omnibox-wrap"},
        h("form", {className:"omnibox",onSubmit:submitOmni},
          h(Icon,{name:"search",size:14}),
          h("input", {
            value:query,
            onChange:e=>setQuery(e.target.value),
            placeholder:"Search or enter URL"
          }),
          h(motion.button, {
            type:"button",
            className:"star"+(activeBookmarked?" saved":""),
            whileTap:{scale:.86,rotate:-8},
            onClick:toggleBookmark
          }, h(Icon,{name:"star",size:14}))

        suggestions.length>0 && h(motion.ul, {
          className:"suggestions open",
          initial:{opacity:0,y:-5,scale:.985},
          animate:{opacity:1,y:0,scale:1},
          exit:{opacity:0,y:-4,scale:.99},
          transition:{type:"spring",stiffness:420,damping:30}
        },

              h("span",null,item.title||item.url),
              h("span",{className:"suggestion-type"},"WEB")

          )
        )
      ),
      h(motion.button,{className:"icon-button",onClick:createTab,whileTap:{scale:.9}},h(Icon,{name:"plus"}))
    );

    const homeNode =
      !showResults && !currentUrl && h(
        motion.section,
        {
          className:"home",
          initial:{opacity:0,scale:.985},
          animate:{opacity:1,scale:1},
          exit:{opacity:0,scale:.995},
          transition:{duration:.28}
        },
        h("div",{className:"home-inner"},
          h(motion.h1, {
            className:"logo",
            initial:{y:18,scale:.94,filter:"blur(5px)"},
            animate:{y:0,scale:1,filter:"blur(0px)"},
            transition:{type:"spring",stiffness:170,damping:18,mass:.72}
          }, "PROXUS"),
          h(motion.div, {
            className:"logo-line",
            initial:{scaleX:.02,opacity:.5},
            animate:{scaleX:1,opacity:1},
            transition:{type:"spring",stiffness:230,damping:22,mass:.6}
          }),
          h(motion.form, {
            className:"home-search",
            onSubmit:submitHome,
            initial:{y:18,opacity:0},
            animate:{y:0,opacity:1},
            transition:{delay:.08,type:"spring",stiffness:180,damping:22}
          },
            h("div",{className:"home-search-inner"},
              h(Icon,{name:"search",size:17}),
              h("input",{
                value:homeQuery,
                onChange:e=>{setHomeQuery(e.target.value);setQuery(e.target.value)},

                autoComplete:"off"
              })
            )
          ),
          h("div",{className:"shortcuts"},
            ["Search","Open source","Web development"].map((label,i)=>
              h(motion.button, {
                key:label,
                className:"shortcut",
                onClick:()=>{setHomeQuery(label);setQuery(label);search(label)},
                initial:{y:10,opacity:0},
                animate:{y:0,opacity:1},
                transition:{delay:.16+i*.045,type:"spring",stiffness:260,damping:25},
                whileHover:{y:-2,scale:1.015},
                whileTap:{scale:.97}
              }, label)
            )
          ),
          h(motion.div, {
            className:"warning",
            initial:{y:8,opacity:0},
            animate:{y:0,opacity:1},
            transition:{delay:.28,type:"spring",stiffness:240,damping:26}
          },
            h(Icon,{name:"shield",size:13}),
            h("span",null,"Not intended to bypass access restrictions.")
          )
        )
      );

    const resultNode=(item,i)=>{
      if(searchType==="image"){
        return h(motion.a,{
          key:item.url||item.image||i,
          className:"image-result",
          href:item.url||item.image||"#",
          target:"_blank",
          rel:"noopener noreferrer",
          initial:{opacity:0,y:8},
          animate:{opacity:1,y:0},
          transition:{delay:Math.min(i*.02,.16),type:"spring",stiffness:260,damping:28},
          whileHover:{y:-2,scale:1.008}
        },
          item.image&&h("img",{src:item.image,alt:item.title||"",loading:"lazy",onError:e=>{const el=e.currentTarget;if(el.dataset.proxusFallback==='1')return;el.dataset.proxusFallback='1';el.src=proxyAsset(item.image)}}),
          h("div",{className:"image-result-copy"},
            h("div",{className:"result-title"},item.title||item.url),
            h("div",{className:"result-url"},item.width&&item.height?(item.width+" × "+item.height):item.url)
          )
        );
      }

      return h(motion.a,{
        key:item.url||i,
        className:"result",
        href:"#",
        onClick:e=>{e.preventDefault();navigate(item.url)},
        initial:{opacity:0,y:10},
        animate:{opacity:1,y:0},
        transition:{delay:Math.min(i*.025,.18),type:"spring",stiffness:260,damping:28},
        whileHover:{y:-1}
      },
        h("div",{className:"result-card-inner"},
          h("div",{className:"result-card-text"},
            h("div",{className:"result-site-row"},
              h("span",{className:"result-site-name"},item.source||cleanHost(item.url))
            ),
            h("div",{className:"result-url"},item.url||""),
            h("div",{className:"result-title"},item.title||item.url),
            h("div",{className:"result-desc"},item.description||item.desc||""),
            searchType==="shopping" && h("div",{className:"shopping-meta"},
              item.price||"",
              item.rating!=null?" · "+item.rating+"/5":"",
              item.reviews!=null?" · "+item.reviews+" reviews":""
            ),
            searchType==="news" && item.age && h("div",{className:"result-age"},item.age)
          ),
          item.thumbnail && h("img",{className:"result-thumb",src:item.thumbnail,alt:"",loading:"lazy",onError:e=>{const el=e.currentTarget;if(el.dataset.proxusFallback==='1'){el.remove();return;}el.dataset.proxusFallback='1';el.src=proxyAsset(item.thumbnail)}})
        )
      );
    };

    const resultsNode =
      showResults && h(
        motion.section,
        {
          className:"results visible",
          initial:{opacity:0,y:8},
          animate:{opacity:1,y:0},
          transition:{type:"spring",stiffness:220,damping:24}
        },
        h("div",{className:"results-inner"},
          h("div",{className:"results-header"},
            h("span",{className:"results-query"},query),
            h("span",{className:"results-meta"},results.length+" results"),
            h("div",{className:"result-types"},
              [["web","Web"],["news","News"],["shopping","Shopping"],["image","Images"]].map(([type,label])=>
                h(motion.button,{
                  key:type,
                  className:"result-type"+(searchType===type?" active":""),
                  onClick:()=>{setSearchType(type);search(query,type)},
                  whileTap:{scale:.96}
                },
                  searchType===type && h(motion.span,{
                    layoutId:"result-type-highlight",
                    className:"result-type-highlight",
                    transition:{type:"spring",stiffness:520,damping:38,mass:.7}
                  }),
                  h("span",{className:"result-type-label"},label)
                )
              )
            )
          ),
          searchType==="image"
            ? h("div",{className:"image-results"},results.map(resultNode))
            : results.length
              ? results.map(resultNode)
              : h("div",{className:"results-empty"},loading?"Searching…":"No results found.")
        )
      );

    const webNode =
      currentUrl && !showResults && h(
        motion.section,
        {
          className:"web-view visible",
          initial:{opacity:0,scale:.995},
          animate:{opacity:1,scale:1},
          transition:{duration:.22}
        },
        h("iframe",{
          ref:frameRef,
          className:"frame",
          srcDoc:frameHtml,
          sandbox:"allow-same-origin allow-scripts allow-forms allow-popups allow-modals",
          title:"PROXUS"
        }),
        sourceMode && h("pre",{className:"source",style:{display:"block"}},rawHtml)
      );

    const themeOptions=[
      ["obsidian","Obsidian","#050505"],
      ["ash","Ash","#1a1b20"],
      ["frost","Frost","#12212c"],
      ["ocean","Ocean","#0d3947"],
      ["forest","Forest","#173b29"],
      ["ember","Ember","#432317"]
    ];

    const settingsNode = settingsOpen && h(
      motion.div,
      {className:"settings-backdrop",initial:{opacity:0},animate:{opacity:1},exit:{opacity:0}},
      h(motion.aside,{className:"settings-panel",initial:{y:18,opacity:0,scale:.995},animate:{y:0,opacity:1,scale:1},transition:{type:"spring",stiffness:260,damping:28}},
        h("div",{className:"settings-shell"},
          h("div",{className:"settings-header"},
            h("div",{className:"settings-title-wrap"},
              h("div",{className:"settings-title"},"Settings"),
              h("div",{className:"settings-subtitle"},"PROXUS workspace")
            ),
            h(motion.button,{className:"settings-close",onClick:()=>setSettingsOpen(false),whileTap:{scale:.9}},h(Icon,{name:"close",size:16}))
          ),
          h("div",{className:"settings-grid"},
            h("div",null,
              h("div",{className:"settings-card"},
                h("div",{className:"settings-card-title"},"Appearance"),
                h("div",{className:"settings-card-copy"},"Choose the look and motion style of the workspace."),
                h("div",{className:"settings-section"},
                  h("div",{className:"settings-label"},"Theme"),
                  h("div",{className:"settings-options"},themeOptions.map(([id,label,swatch])=>
                    h(motion.button,{key:id,className:"settings-option theme-option"+(theme===id?" active":""),onClick:()=>setTheme(id),whileTap:{scale:.97}},
                      h("span",{className:"theme-swatch",style:{background:swatch}}),label
                    )
                  ))
                ),
                h("div",{className:"settings-section"},
                  h("div",{className:"settings-label"},"Background"),
                  h(motion.button,{className:"switch-row",onClick:()=>setDustEnabled(v=>!v),whileTap:{scale:.985}},
                    h("span",null,"Falling dust"),
                    h("span",{className:"switch"+(dustEnabled?" on":"")},h("span",null))
                  )
                ),
                h("div",{className:"settings-preview"},
                  h("div",{className:"settings-preview-box"},h("div",{className:"settings-preview-bar"}),h("div",{className:"settings-preview-line"}),h("div",{className:"settings-preview-line short"})),
                  h("div",{className:"settings-preview-box"},h("div",{className:"settings-preview-line"}),h("div",{className:"settings-preview-bar"}),h("div",{className:"settings-preview-line short"}))
                )
              ),
              h("div",{className:"settings-card"},
                h("div",{className:"settings-card-title"},"Search"),
                h("div",{className:"settings-card-copy"},"Control how results are presented and filtered."),
                h("div",{className:"settings-section"},
                  h("div",{className:"settings-label"},"Default result type"),
                  h("div",{className:"settings-options"},[["web","Web"],["news","News"],["shopping","Shopping"],["image","Images"]].map(([type,label])=>
                    h(motion.button,{key:type,className:"settings-option"+(searchType===type?" active":""),onClick:()=>setSearchType(type),whileTap:{scale:.97}},label)
                  ))
                ),
                h("div",{className:"settings-section"},
                  h("div",{className:"settings-label"},"Safety"),
                  h(motion.button,{className:"switch-row",onClick:()=>setSafeSearch(v=>!v),whileTap:{scale:.985}},
                    h("span",null,safeSearch?"Moderate safe search":"Safe search off"),
                    h("span",{className:"switch"+(safeSearch?" on":"")},h("span",null))
                  )
                )
              )
            ),
            h("div",null,
              h("div",{className:"settings-card"},
                h("div",{className:"settings-card-title"},"Pointer & typing"),
                h("div",{className:"settings-card-copy"},"Optional motion for the pointer and a smoother text caret."),
                h("div",{className:"settings-section"},
                  h("div",{className:"settings-label"},"Pointer"),
                  h(motion.button,{className:"switch-row",onClick:()=>setCustomCursor(v=>!v),whileTap:{scale:.985}},
                    h("span",null,"Custom ring cursor"),
                    h("span",{className:"switch"+(customCursor?" on":"")},h("span",null))
                  )
                ),
                h("div",{className:"settings-section"},
                  h("div",{className:"settings-label"},"Typing"),
                  h(motion.button,{className:"switch-row",onClick:()=>setSmoothCaret(v=>!v),whileTap:{scale:.985}},
                    h("span",null,"Smooth typing caret"),
                    h("span",{className:"switch"+(smoothCaret?" on":"")},h("span",null))

              h("div",{className:"settings-card"},

                          h("span",null,bookmark.title||bookmark.url),h(Icon,{name:"external",size:12})
                        )

                    : h("div",{className:"settings-muted"},"No saved bookmarks")

              ),
              h("div",{className:"settings-card"},
                h("div",{className:"settings-card-title"},"Privacy"),
                h("div",{className:"settings-card-copy"},"PROXUS is not intended for bypassing access restrictions."),
                h("div",{className:"settings-section"},
                  h("div",{className:"settings-muted"},"The private route control applies to the PROXUS web view rather than changing your device network.")

    const appNode = h(
      "div",
      {className:"app"+(customCursor?" cursor-ring-enabled":""),
      },
      dustEnabled && h(Dust),
      h(CustomCursor,{enabled:customCursor}),
      h(SmoothCaret,{enabled:smoothCaret}),
      h("div",{className:"shell"},
        sidebarNode,
        h("main",{className:"main"},
          toolbarNode,
          h("section",{className:"view"},
            homeNode,
            resultsNode,
            webNode,
            loading && h(motion.div,{className:"loading",initial:{opacity:0},animate:{opacity:1},exit:{opacity:0}},h(motion.div,{className:"loading-ring",animate:{rotate:360},transition:{repeat:Infinity,duration:.75,ease:"linear"}}))
          )
        )
      )
    );

    return h(React.Fragment,null,
      appNode,
      settingsNode,
      toast && h(motion.div,{className:"toast",initial:{opacity:0,y:10,scale:.97},animate:{opacity:1,y:0,scale:1},exit:{opacity:0,y:6,scale:.98},transition:{type:"spring",stiffness:360,damping:28}},h("strong",null,toast.title),toast.message)

  function installSmoothScrolling(){
    const apply=()=>{
      document.querySelectorAll('*').forEach(el=>{
        const cs=getComputedStyle(el);
        if((cs.overflowY==='auto'||cs.overflowY==='scroll'||cs.overflow==='auto'||cs.overflow==='scroll') && el.scrollHeight>el.clientHeight){
          el.style.scrollBehavior='smooth';
          el.style.overscrollBehavior='contain';
        }
      });
    };
    apply();
    new MutationObserver(apply).observe(document.body,{subtree:true,childList:true});
  }
  installSmoothScrolling();
  createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
