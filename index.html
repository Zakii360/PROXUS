<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="PROXUS" />
  <title>PROXUS</title>

  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@19.3.0",
      "react/jsx-runtime": "https://esm.sh/react@19.3.0/jsx-runtime",
      "react/jsx-dev-runtime": "https://esm.sh/react@19.3.0/jsx-dev-runtime",
      "react-dom": "https://esm.sh/react-dom@19.3.0",
      "react-dom/client": "https://esm.sh/react-dom@19.3.0/client",
      "motion/react": "https://esm.sh/motion@12.23.12/react?external=react,react-dom"
    }
  }
  </script>

  <style>
    @import url("https://cdn.jsdelivr.net/npm/@fontsource-variable/geist@5.2.8/index.css");
    @import url("https://cdn.jsdelivr.net/npm/@fontsource-variable/manrope@5.2.8/index.css");

    :root {
      --bg:#000;
      --surface:rgba(16,16,20,.76);
      --surface-2:rgba(23,23,28,.82);
      --surface-3:rgba(31,31,37,.9);
      --border:rgba(255,255,255,.09);
      --border-strong:rgba(255,255,255,.16);
      --text:#f5f6f8;
      --muted:#96969e;
      --muted-2:#66666e;
      --sidebar:240px;
      --ease:cubic-bezier(.16,1,.3,1);
    }

    *{box-sizing:border-box}
    html,body,#root{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
    body{
      color:var(--text);
      font-family:Geist Variable,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }
    button,input{font:inherit;color:inherit}
    button{border:0;background:none;cursor:pointer}
    input{outline:none}
    svg{display:block}

    .app{
      position:relative;
      width:100%;
      height:100%;
      overflow:hidden;
      background:
        radial-gradient(circle at 70% -20%, rgba(37,54,104,.11), transparent 35%),
        radial-gradient(circle at 0 100%, rgba(8,75,92,.055), transparent 31%),
        #000;
    }

    .dust{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      z-index:0;
      pointer-events:none;
    }

    .shell{
      position:relative;
      z-index:1;
      width:100%;
      height:100%;
      display:flex;
    }

    .sidebar{
      position:relative;
      z-index:20;
      width:var(--sidebar);
      min-width:0;
      height:100%;
      flex:0 0 var(--sidebar);
      overflow:hidden;
      border-right:1px solid var(--border);
      background:rgba(7,7,9,.78);
      backdrop-filter:blur(28px) saturate(1.3);
      -webkit-backdrop-filter:blur(28px) saturate(1.3);
    }

    .sidebar-inner{
      height:100%;
      padding:8px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .brand{
      height:38px;
      display:flex;
      align-items:center;
      gap:9px;
      padding:0 5px;
    }

    .brand-mark{
      width:28px;
      height:28px;
      border-radius:6px;
      background:#fff;
      color:#000;
      display:grid;
      place-items:center;
      font-family:Manrope Variable,sans-serif;
      font-size:10px;
      font-weight:800;
      letter-spacing:-.06em;
      flex:0 0 auto;
    }

    .brand-name{font-size:13px;font-weight:650;line-height:1}
    .brand-sub{margin-top:3px;color:var(--muted-2);font-size:9px}

    .side-search{
      height:34px;
      display:flex;
      align-items:center;
      gap:7px;
      padding:0 9px;
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:5px;
    }

    .side-search:focus-within{background:var(--surface-2);border-color:var(--border-strong)}
    .side-search input{width:100%;height:100%;background:none;border:0;font-size:11px}
    .side-search input::placeholder{color:var(--muted-2)}

    .bookmarks{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
    .bookmark{
      height:36px;
      border:1px solid transparent;
      border-radius:5px;
      background:rgba(255,255,255,.025);
      color:var(--muted);
      display:grid;
      place-items:center;
      font-size:9px;
      font-weight:650;
    }
    .bookmark:hover{background:var(--surface-2);border-color:var(--border);color:var(--text)}

    .new-tab{
      height:36px;
      display:flex;
      align-items:center;
      gap:9px;
      padding:0 9px;
      border-radius:5px;
      color:var(--muted);
      font-size:11px;
    }
    .new-tab:hover{background:var(--surface-2);color:var(--text)}

    .tab-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:2px;min-height:0;overflow:auto;flex:1}

    .tab{
      position:relative;
      min-height:36px;
      display:flex;
      align-items:center;
      gap:8px;
      padding:0 7px;
      border-radius:5px;
      color:var(--muted);
      overflow:hidden;
    }
    .tab:hover{color:var(--text)}
    .tab-title{position:relative;z-index:1;min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}
    .tab-close{position:relative;z-index:2;width:20px;height:20px;display:grid;place-items:center;border-radius:4px;color:var(--muted);opacity:0}
    .tab:hover .tab-close,.tab.active .tab-close{opacity:1}
    .tab-close:hover{background:rgba(255,255,255,.08);color:var(--text)}
    .tab-highlight{position:absolute;inset:0;border-radius:5px;background:var(--surface-2);z-index:0}

    .side-bottom{padding-top:6px;border-top:1px solid var(--border);display:grid;gap:2px}
    .side-button{height:34px;display:flex;align-items:center;gap:9px;padding:0 9px;border-radius:5px;color:var(--muted);font-size:11px}
    .side-button:hover{background:var(--surface-2);color:var(--text)}

    .main{min-width:0;min-height:0;flex:1;height:100%;display:flex;flex-direction:column}

    .toolbar{
      position:relative;
      z-index:15;
      height:52px;
      flex:0 0 52px;
      display:flex;
      align-items:center;
      gap:6px;
      padding:8px;
      border-bottom:1px solid var(--border);
      background:rgba(5,5,7,.68);
      backdrop-filter:blur(26px) saturate(1.3);
      -webkit-backdrop-filter:blur(26px) saturate(1.3);
    }

    .toolbar-actions{display:flex;gap:2px;align-items:center}
    .icon-button{
      position:relative;
      width:28px;
      height:28px;
      display:grid;
      place-items:center;
      border-radius:5px;
      color:var(--muted);
    }
    .icon-button:hover:not(:disabled){background:var(--surface-2);color:var(--text)}
    .icon-button:disabled{opacity:.27;cursor:not-allowed}

    .omnibox-wrap{position:relative;flex:1;min-width:0}
    .omnibox{
      height:36px;
      display:flex;
      align-items:center;
      gap:8px;
      padding:0 9px;
      border:1px solid var(--border);
      border-radius:5px;
      background:var(--surface);
    }
    .omnibox:focus-within{background:var(--surface-2);border-color:var(--border-strong)}
    .omnibox input{min-width:0;flex:1;height:100%;border:0;background:transparent;font-size:12px}
    .omnibox input::placeholder{color:var(--muted-2)}
    .star{width:24px;height:24px;display:grid;place-items:center;border-radius:4px;color:var(--muted)}
    .star:hover{background:rgba(255,255,255,.07);color:var(--text)}
    .star.saved{color:#fff}

    .suggestions{
      position:absolute;
      left:0;
      right:0;
      top:41px;
      z-index:50;
      display:none;
      margin:0;
      padding:5px;
      list-style:none;
      background:#151519;
      border:1px solid var(--border-strong);
      border-radius:5px;
      box-shadow:0 22px 60px rgba(0,0,0,.45);
    }
    .suggestions.open{display:block}
    .suggestion{height:34px;padding:0 9px;display:flex;align-items:center;gap:8px;border-radius:4px;color:var(--muted);font-size:11px}
    .suggestion:hover,.suggestion.selected{background:var(--surface-2);color:var(--text)}
    .suggestion-type{margin-left:auto;color:var(--muted-2);font-size:8px}

    .view{position:relative;flex:1;min-height:0;overflow:hidden}

    .home{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:auto;
      background:radial-gradient(circle at 50% 42%,rgba(31,45,85,.12),transparent 36%);
    }

    .home-inner{width:min(670px,calc(100% - 40px));margin-top:-6vh;text-align:center}
    .logo{margin:0;font-family:Manrope Variable,sans-serif;font-size:64px;line-height:.93;letter-spacing:-.065em;font-weight:650;will-change:transform}
    .logo-line{height:3px;margin-top:14px;border-radius:999px;background:#fff;transform-origin:center;box-shadow:0 0 18px rgba(255,255,255,.15)}
    .home-search{margin-top:28px}
    .home-search-inner{
      height:52px;
      width:100%;
      padding:0 14px;
      display:flex;
      align-items:center;
      gap:8px;
      border:1px solid var(--border);
      border-radius:7px;
      background:var(--surface);
    }
    .home-search-inner:focus-within{background:var(--surface-2);border-color:var(--border-strong)}
    .home-search-inner input{min-width:0;flex:1;height:100%;background:none;border:0;font-size:14px}
    .home-search-inner input::placeholder{color:var(--muted-2)}

    .shortcuts{display:flex;justify-content:center;gap:5px;margin-top:12px;flex-wrap:wrap}
    .shortcut{padding:6px 9px;border:1px solid var(--border);background:rgba(255,255,255,.02);border-radius:999px;color:var(--muted);font-size:9px}
    .shortcut:hover{background:var(--surface-2);color:var(--text);border-color:var(--border-strong)}

    .warning{
      width:max-content;
      max-width:100%;
      margin:19px auto 0;
      display:flex;
      align-items:center;
      gap:7px;
      color:var(--muted-2);
      font-size:9px;
    }

    .results{position:absolute;inset:0;display:none;overflow:auto;padding:26px 28px 50px;background:#000}
    .results.visible{display:block}
    .results-inner{width:min(820px,100%);margin:0 auto}
    .results-header{display:flex;gap:8px;align-items:center;margin-bottom:12px}
    .results-query{font-size:13px;font-weight:650}
    .results-meta{font-size:9px;color:var(--muted-2)}
    .result{display:block;margin-bottom:7px;padding:13px;border:1px solid var(--border);border-radius:6px;background:rgba(12,12,15,.68)}
    .result:hover{background:var(--surface-2);border-color:var(--border-strong)}
    .result-url{font-size:9px;color:#777780;margin-bottom:5px;overflow-wrap:anywhere}
    .result-title{font-size:13px;font-weight:650;margin-bottom:5px}
    .result-desc{font-size:10px;line-height:1.55;color:var(--muted)}
    .results-empty{padding:35px;text-align:center;color:var(--muted);font-size:10px}

    .web-view{position:absolute;inset:0;display:none;background:#fff}
    .web-view.visible{display:block}
    .frame{display:block;width:100%;height:100%;border:0;background:#fff}
    .source{position:absolute;inset:0;display:none;overflow:auto;margin:0;padding:18px;background:#0c0d11;color:#b9f5c8;font:12px/1.55 Consolas,Monaco,SFMono-Regular,monospace;white-space:pre-wrap}

    .loading{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:10;background:rgba(0,0,0,.28);backdrop-filter:blur(5px)}
    .loading.visible{display:flex}
    .loading-ring{width:26px;height:26px;border:2px solid rgba(255,255,255,.12);border-top-color:#fff;border-radius:50%}

    .result-types{margin-left:auto;display:flex;gap:2px;padding:2px;border:1px solid var(--border);border-radius:5px;background:rgba(255,255,255,.02)}
    .result-type{height:25px;padding:0 8px;border-radius:4px;color:var(--muted);font-size:9px}
    .result-type:hover{background:var(--surface-2);color:var(--text)}
    .result-type.active{background:var(--surface-3);color:var(--text)}
    .shopping-meta{margin-bottom:5px;color:#d5d5da;font-size:10px}
    .result-age{margin-top:6px;color:var(--muted-2);font-size:9px}
    .image-results{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
    .image-result{display:block;overflow:hidden;border:1px solid var(--border);border-radius:6px;background:rgba(12,12,15,.68)}
    .image-result:hover{border-color:var(--border-strong);background:var(--surface-2)}
    .image-result img{display:block;width:100%;aspect-ratio:1.28;object-fit:cover;background:#101014}
    .image-result-copy{padding:8px}
    .image-result-copy .result-title{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px;font-size:10px}
    .settings-backdrop{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.28);backdrop-filter:blur(3px);display:flex;justify-content:flex-end}
    .settings-panel{width:min(340px,92vw);height:100%;padding:14px;background:rgba(14,14,18,.94);border-left:1px solid var(--border-2);box-shadow:-18px 0 50px rgba(0,0,0,.35);overflow:auto}
    .settings-header{height:36px;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
    .settings-title{font-size:13px;font-weight:650}
    .settings-section{padding:12px 0;border-top:1px solid var(--border)}
    .settings-label{margin-bottom:8px;color:var(--muted-2);font-size:9px;text-transform:uppercase;letter-spacing:.1em}
    .settings-options{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}
    .settings-option{height:32px;border:1px solid var(--border);border-radius:5px;color:var(--muted);font-size:10px;background:rgba(255,255,255,.02)}
    .settings-option.active{background:var(--surface-3);color:var(--text);border-color:var(--border-2)}
    .switch-row{width:100%;height:34px;padding:0 9px;display:flex;align-items:center;justify-content:space-between;border:1px solid var(--border);border-radius:5px;background:rgba(255,255,255,.02);font-size:10px;color:var(--text)}
    .switch{width:28px;height:16px;border-radius:999px;background:#2a2a30;padding:2px;transition:background .18s ease}
    .switch span{display:block;width:12px;height:12px;border-radius:50%;background:#777780;transition:transform .18s var(--ease),background .18s ease}
    .switch.on{background:#eee}
    .switch.on span{transform:translateX(12px);background:#111}
    .bookmark-list{display:flex;flex-direction:column;gap:3px}
    .bookmark-list-item{min-height:32px;padding:0 9px;display:flex;align-items:center;justify-content:space-between;border-radius:5px;color:var(--muted);font-size:10px;text-align:left}
    .bookmark-list-item:hover{background:var(--surface-2);color:var(--text)}
    .settings-muted,.settings-note{color:var(--muted-2);font-size:9px;line-height:1.5}

    .toast{position:fixed;right:14px;bottom:14px;z-index:100;max-width:340px;padding:11px 13px;border:1px solid var(--border-strong);background:rgba(20,20,24,.94);backdrop-filter:blur(18px);border-radius:6px;color:var(--muted);font-size:10px;box-shadow:0 16px 50px rgba(0,0,0,.45)}
    .toast strong{display:block;color:var(--text);margin-bottom:3px}

    @media(max-width:760px){
      .sidebar{position:absolute;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .24s var(--ease);box-shadow:15px 0 50px rgba(0,0,0,.35)}
      .sidebar.mobile-open{transform:translateX(0)}
      .mobile-menu{display:grid}
      .logo{font-size:48px}
      .home-inner{width:calc(100% - 24px)}
    }
    @media(min-width:761px){.mobile-menu{display:none}}
    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="module">

  import React, {useEffect, useMemo, useRef, useState} from "react";
  import {createRoot} from "react-dom/client";
  import {motion, useMotionValue, useSpring} from "motion/react";

  const {createElement: h} = React;

  const SEARCH_API = "https://api.360-search.com/";
  const SUPABASE_PROXY = "https://wiswfpfsjiowtrdyqpxy.supabase.co/functions/v1/web-viewer";

  const iconPaths = {
    search: h("g", null, h("circle", {cx:11, cy:11, r:7}), h("line", {x1:21, y1:21, x2:16.65, y2:16.65})),
    back: h("polyline", {points:"15 18 9 12 15 6"}),
    forward: h("polyline", {points:"9 18 15 12 9 6"}),
    reload: h("g", null, h("polyline", {points:"23 4 23 10 17 10"}), h("path", {d:"M20.49 15a9 9 0 1 1-2.12-9.36L23 10"})),
    plus: h("path", {d:"M12 5v14M5 12h14"}),
    close: h("path", {d:"M6 6l12 12M18 6 6 18"}),
    star: h("path", {d:"m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9L12 3Z"}),
    globe: h("g", null, h("circle", {cx:12, cy:12, r:8}), h("path", {d:"M4 12h16"}), h("path", {d:"M12 4a12 12 0 0 1 0 16"})),
    panel: h("g", null, h("rect", {x:3,y:4,width:18,height:16,rx:2}), h("line", {x1:9,y1:4,x2:9,y2:20})),
    info: h("g", null, h("circle", {cx:12,cy:12,r:9}), h("path", {d:"M12 10v6"}), h("path", {d:"M12 7h.01"})),
    shield: h("g", null, h("path", {d:"M12 3 4 6v5c0 5 3 8 8 10 5-2 8-5 8-10V6z"})),
    external: h("g", null, h("path", {d:"M14 4h6v6"}), h("path", {d:"m20 4-9 9"}), h("path", {d:"M18 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5"})),
    settings: h("g", null, h("circle", {cx:12,cy:12,r:3}), h("path", {d:"M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1-2.1 2.1-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5v.1h-3v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1-2.1-2.1.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H5v-3h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1 2.1-2.1.1.1a1.7 1.7 0 0 0 1.8.3 1.7 1.7 0 0 0 1-1.5V5h3v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1 2.1 2.1-.1.1a1.7 1.7 0 0 0-.3 1.8 1.7 1.7 0 0 0 1.5 1h.1v3h-.1a1.7 1.7 0 0 0-1.4.8Z"}))
  };

  function Icon({name,size=16,className=""}){
    return h("svg", {viewBox:"0 0 24 24", width:size, height:size, className, "aria-hidden":"true", stroke:"currentColor", fill:"none", strokeWidth:"1.7", strokeLinecap:"round", strokeLinejoin:"round"}, iconPaths[name]);
  }

  function Dust(){
    const ref = useRef(null);
    const px = useMotionValue(0);
    const py = useMotionValue(0);
    const sx = useSpring(px,{stiffness:50,damping:18,mass:.6});
    const sy = useSpring(py,{stiffness:50,damping:18,mass:.6});

    useEffect(()=>{
      const canvas = ref.current;
      const ctx = canvas.getContext("2d");
      let width = 0, height = 0, dpr = 1, raf = 0;
      let particles = [];

      const resize=()=>{
        width=innerWidth;
        height=innerHeight;
        dpr=Math.min(devicePixelRatio||1,2);
        canvas.width=width*dpr;
        canvas.height=height*dpr;
        canvas.style.width=width+"px";
        canvas.style.height=height+"px";
        ctx.setTransform(dpr,0,0,dpr,0,0);
        const count=Math.min(84,Math.max(30,Math.floor(width*height/16500)));
        particles=Array.from({length:count},()=>({
          x:Math.random()*width,
          y:Math.random()*height,
          z:.15+Math.random()*.85,
          size:.35+Math.random()*.75,
          speed:.028+Math.random()*.12,
          drift:(Math.random()-.5)*.025,
          phase:Math.random()*Math.PI*2
        }));
      };

      const tick=(time)=>{
        ctx.clearRect(0,0,width,height);
        const ox=sx.get(), oy=sy.get();
        for(const p of particles){
          p.phase += .0017;
          p.y += p.speed;
          p.x += p.drift + Math.sin(p.phase)*.006;
          if(p.y>height+4){p.y=-4;p.x=Math.random()*width}
          if(p.x<-4)p.x=width+4;
          if(p.x>width+4)p.x=-4;
          const x=p.x+ox*p.z*.1;
          const y=p.y+oy*p.z*.1;
          ctx.beginPath();
          ctx.arc(x,y,p.size*p.z,0,Math.PI*2);
          ctx.fillStyle=`rgba(255,255,255,${.025+p.z*.065})`;
          ctx.fill();
        }
        raf=requestAnimationFrame(tick);
      };

      const move=(e)=>{
        px.set((e.clientX-width/2)*-.16);
        py.set((e.clientY-height/2)*-.10);
      };

      resize();
      addEventListener("resize",resize);
      addEventListener("pointermove",move,{passive:true});
      raf=requestAnimationFrame(tick);

      return()=>{
        cancelAnimationFrame(raf);
        removeEventListener("resize",resize);
        removeEventListener("pointermove",move);
      };
    },[]);

    return h("canvas",{ref,className:"dust","aria-hidden":"true"});
  }

  function useStorage(key,fallback){
    const [value,setValue]=useState(()=>{
      try{return JSON.parse(localStorage.getItem(key)) ?? fallback}catch{return fallback}
    });
    useEffect(()=>{
      try{localStorage.setItem(key,JSON.stringify(value))}catch{}
    },[key,value]);
    return [value,setValue];
  }

  function normalizeUrl(raw){
    let value=String(raw||"").trim();
    if(!value)return "";
    if(/^https?:\/\//i.test(value))return value;
    if(/^[a-z0-9-]+(\.[a-z0-9-]+)+(\/.*)?$/i.test(value))return "https://"+value;
    return "";
  }

  function proxify(url){
    return SUPABASE_PROXY+"?url="+encodeURIComponent(url);
  }

  function resolveNavigation(rawUrl, baseUrl=currentUrl){
    const value=String(rawUrl||"").trim();
    if(!value)return "";

    try{
      const parsed=new URL(value,baseUrl||window.location.href);

      if(parsed.origin===new URL(SUPABASE_PROXY).origin &&
         parsed.pathname===new URL(SUPABASE_PROXY).pathname){
        const embedded=parsed.searchParams.get("url");
        if(embedded)return embedded;
      }

      return parsed.href;
    }catch{
      return value;
    }
  }

  function App(){
    const [tabs,setTabs]=useStorage("proxus-tabs",[{id:"home",title:"New Tab",url:"",history:[],historyIndex:-1}]);
    const [activeId,setActiveId]=useStorage("proxus-active","home");
    const [bookmarks,setBookmarks]=useStorage("proxus-bookmarks",[]);
    const [collapsed,setCollapsed]=useStorage("proxus-collapsed",false);
    const [mobileOpen,setMobileOpen]=useState(false);
    const [homeQuery,setHomeQuery]=useState("");
    const [query,setQuery]=useState("");
    const [results,setResults]=useState([]);
    const [showResults,setShowResults]=useState(false);
    const [loading,setLoading]=useState(false);
    const [currentUrl,setCurrentUrl]=useState("");
    const [rawHtml,setRawHtml]=useState("");
    const [sourceMode,setSourceMode]=useState(false);
    const [frameHtml,setFrameHtml]=useState("");
    const [searchType,setSearchType]=useState("web");
    const [safeSearch,setSafeSearch]=useState(true);
    const [dustEnabled,setDustEnabled]=useState(true);
    const [settingsOpen,setSettingsOpen]=useState(false);
    const [suggestions,setSuggestions]=useState([]);
    const [suggestionIndex,setSuggestionIndex]=useState(-1);
    const [toast,setToast]=useState(null);
    const frameRef=useRef(null);
    const suggestTimer=useRef(null);

    const activeTab=useMemo(()=>tabs.find(t=>t.id===activeId)||tabs[0],[tabs,activeId]);
    const currentTab=()=>activeTab;

    const showToast=(title,message)=>{
      setToast({title,message});
      setTimeout(()=>setToast(null),2800);
    };

    const setUrl=(url)=>{
      setCurrentUrl(url);
      setQuery(url);
      setHomeQuery(url);
    };

    const updateTab=(url,title,targetTabId=activeId)=>{
      setTabs(prev=>prev.map(t=>t.id===targetTabId?{...t,url,title:title||t.title||"New Tab"}:t));
    };

    const showHome=(targetTabId=activeId)=>{
      setShowResults(false);
      setSourceMode(false);
      setCurrentUrl("");
      setQuery("");
      setHomeQuery("");
      setTabs(prev=>prev.map(t=>t.id===targetTabId?{...t,url:"",title:"New Tab",history:[],historyIndex:-1}:t));
    };

    const fetchPage=async(url,method="get",pushHistory=true,targetTabId=activeId)=>{
      const resolvedUrl=resolveNavigation(url,currentUrl);
      if(!resolvedUrl)return;

      setLoading(true);
      try{
        const response=await fetch(proxify(resolvedUrl),{method:method==="post"?"POST":"GET"});
        if(!response.ok)throw new Error("Server responded with "+response.status);
        const sourceHtml=await response.text();
        const finalUrl=resolveNavigation(response.headers.get("X-Final-Url")||resolvedUrl,resolvedUrl);
        const html=sourceHtml;
        if(pushHistory){
          setTabs(prev=>prev.map(t=>{
            if(t.id!==targetTabId)return t;
            const history=Array.isArray(t.history)?t.history:[];
            const index=Number.isInteger(t.historyIndex)?t.historyIndex:-1;
            const nextHistory=history.slice(0,index+1);
            if(nextHistory[nextHistory.length-1]!==finalUrl)nextHistory.push(finalUrl);
            return {...t,history:nextHistory,historyIndex:nextHistory.length-1};
          }));
        }
        setRawHtml(html);
        setUrl(finalUrl);
        let title="";
        try{title=(new URL(finalUrl)).hostname}catch{}
        updateTab(finalUrl,title,targetTabId);
        setShowResults(false);
        setFrameHtml(html);
      }catch(err){
        showToast("Could not load page",err.message);
      }finally{
        setLoading(false);
      }
    };

    const navigate=(value)=>{
      const raw=String(value||"").trim();
      if(!raw)return;
      setSuggestions([]);
      setSuggestionIndex(-1);
      const url=normalizeUrl(raw);
      if(url){
        fetchPage(url);
        return;
      }
      search(raw);
    };

    const search=async(q,type=searchType)=>{
      const value=String(q||"").trim().slice(0,500);
      if(!value)return;
      setLoading(true);
      setShowResults(true);
      setQuery(value);
      setResults([]);
      try{
        const params=new URLSearchParams({
          q:value,
          type,
          safe:safeSearch?"moderate":"off",
          limit:"50",
          page:"1"
        });
        const response=await fetch(SEARCH_API+"?"+params.toString(),{method:"GET"});
        if(!response.ok)throw new Error("Search request failed ("+response.status+")");
        const data=await response.json();
        setResults(Array.isArray(data.results)?data.results:[]);
      }catch(err){
        showToast("Search unavailable",err.message);
      }finally{
        setLoading(false);
      }
    };

    useEffect(()=>{
      if(!query||query.length<2||normalizeUrl(query)){setSuggestions([]);setSuggestionIndex(-1);return}
      clearTimeout(suggestTimer.current);
      suggestTimer.current=setTimeout(async()=>{
        try{
          const params=new URLSearchParams({
            q:query.slice(0,500),
            type:searchType,
            safe:safeSearch?"moderate":"off",
            limit:"5",
            page:"1"
          });
          const response=await fetch(SEARCH_API+"?"+params.toString(),{method:"GET"});
          if(!response.ok)return;
          const data=await response.json();
          setSuggestions(Array.isArray(data.results)?data.results.slice(0,5):[]);
          setSuggestionIndex(-1);
        }catch{}
      },180);
      return()=>clearTimeout(suggestTimer.current);
    },[query,searchType,safeSearch]);

    const createTab=()=>{
      const tab={id:(crypto.randomUUID ? crypto.randomUUID() : "px-"+Date.now().toString(36)+Math.random().toString(36).slice(2,8)),title:"New Tab",url:"",history:[],historyIndex:-1};
      setTabs(prev=>[...prev,tab]);
      setActiveId(tab.id);
      setCurrentUrl("");
      setQuery("");
      setHomeQuery("");
      setShowResults(false);
      setMobileOpen(false);
    };

    const closeTab=(id)=>{
      if(tabs.length<=1){
        showHome();
        return;
      }
      const index=tabs.findIndex(t=>t.id===id);
      const next=tabs[index+1]||tabs[index-1];
      setTabs(prev=>prev.filter(t=>t.id!==id));
      if(id===activeId){
        setActiveId(next.id);
        if(next.url)fetchPage(next.url,"get",false,next.id);else showHome(next.id);
      }
    };

    const goTab=(tab)=>{
      setActiveId(tab.id);
      if(tab.url)fetchPage(tab.url,"get",false,tab.id);else showHome(tab.id);
      setMobileOpen(false);
    };

    const goHistory=(direction)=>{
      const tab=currentTab();
      if(!tab)return;
      const history=Array.isArray(tab.history)?tab.history:[];
      let index=Number.isInteger(tab.historyIndex)?tab.historyIndex:-1;
      const next=index+direction;
      if(next<0||next>=history.length)return;
      const target=history[next];
      setTabs(prev=>prev.map(t=>t.id===activeId?{...t,historyIndex:next}:t));
      fetchPage(target,"get",false);
    };

    const reload=()=>{
      if(currentUrl)fetchPage(currentUrl,"get",false);
    };

    const toggleBookmark=()=>{
      if(!currentUrl)return showToast("Nothing to bookmark","Open a page first.");
      const exists=bookmarks.some(b=>b.url===currentUrl);
      if(exists){
        setBookmarks(bookmarks.filter(b=>b.url!==currentUrl));
        showToast("Bookmark removed",currentUrl);
      }else{
        setBookmarks([...bookmarks,{url:currentUrl,title:activeTab?.title||currentUrl}]);
        showToast("Bookmark saved",currentUrl);
      }
    };

    useEffect(()=>{
      const onMessage=(event)=>{
        if(frameRef.current && event.source !== frameRef.current.contentWindow)return;
        const data=event.data;
        if(!data||typeof data!=="object")return;
        if(data.type==="360-navigate"&&data.url)fetchPage(resolveNavigation(data.url,currentUrl),data.method);
        if(data.type==="360-meta"&&data.url){
          const metaUrl=resolveNavigation(data.url,currentUrl);
          setUrl(metaUrl);
          setTabs(prev=>prev.map(t=>{
            if(t.id!==activeId)return t;
            const history=Array.isArray(t.history)?t.history:[];
            const index=Number.isInteger(t.historyIndex)?t.historyIndex:-1;
            const current=history[index];
            if(current===metaUrl)return {...t,url:metaUrl};
            const nextHistory=history.slice(0,index+1);
            nextHistory.push(metaUrl);
            return {...t,url:metaUrl,history:nextHistory,historyIndex:nextHistory.length-1};
          }));
        }
        if(data.type==="360-alert"&&typeof data.msg==="string")alert(data.msg);
        if(data.type==="360-confirm"&&typeof data.msg==="string")confirm(data.msg);
        if(data.type==="360-prompt"&&typeof data.msg==="string")prompt(data.msg,data.def);
      };
      addEventListener("message",onMessage);
      return()=>removeEventListener("message",onMessage);
    },[activeId,activeTab?.title]);

    useEffect(()=>{
      const frame=frameRef.current;
      if(!frame)return;

      const onLoad=()=>{
        try{
          const href=frame.contentWindow?.location?.href || "";
          if(href && href!=="about:srcdoc" && href!=="about:blank" && /^https?:\/\//i.test(href)){
            const tab=currentTab();
            if(tab && href!==currentUrl){
              fetchPage(href,"get",true,tab.id);
            }
          }
        }catch{}
      };

      frame.addEventListener("load",onLoad);
      return()=>frame.removeEventListener("load",onLoad);
    },[currentUrl,activeId]);

    useEffect(()=>{
      if(!tabs.length){
        const tab={id:(crypto.randomUUID ? crypto.randomUUID() : "px-"+Date.now().toString(36)+Math.random().toString(36).slice(2,8)),title:"New Tab",url:"",history:[],historyIndex:-1};
        setTabs([tab]);
        setActiveId(tab.id);
        return;
      }
      if(!tabs.some(t=>t.id===activeId))setActiveId(tabs[0].id);

                className:"tab-highlight",

              }),
              h(Icon,{name:tab.url?"globe":"plus",size:14}),

              !collapsed && h("button", {
                className:"tab-close",

            onClick:()=>setSettingsOpen(true)
          },

          ),

            className:"side-button",
            whileHover:{x:2},
            onClick:()=>showToast("PROXUS","Authorized access only.")
          },
            h(Icon,{name:"info",size:15}),
            h("span",null,"About")
          )
        )
      )
    );

    const toolbarNode = h(
      "header",
      {className:"toolbar"},
      h(motion.button, {
        className:"icon-button mobile-menu",
        whileTap:{scale:.9},
        onClick:()=>setMobileOpen(v=>!v)
      },
        h("svg", {viewBox:"0 0 24 24",width:16,height:16,stroke:"currentColor",fill:"none",strokeWidth:1.7,strokeLinecap:"round"},
          h("path", {d:"M4 6h16M4 12h16M4 18h16"})
        )
      ),
      h("div", {className:"toolbar-actions"},
        h(motion.button,{className:"icon-button",disabled:!(currentTab()?.historyIndex>0),onClick:()=>goHistory(-1),whileTap:{scale:.9}},h(Icon,{name:"back"})),
        h(motion.button,{className:"icon-button",disabled:!((currentTab()?.historyIndex??-1)<((currentTab()?.history?.length??0)-1)),onClick:()=>goHistory(1),whileTap:{scale:.9}},h(Icon,{name:"forward"})),
        h(motion.button,{className:"icon-button",onClick:reload,whileTap:{scale:.9}},h(Icon,{name:"reload"}))
      ),
      h("div", {className:"omnibox-wrap"},
        h("form", {className:"omnibox",onSubmit:submitOmni},
          h(Icon,{name:"search",size:14}),
          h("input", {
            value:query,
            onChange:e=>setQuery(e.target.value),
            placeholder:"Search or enter URL"
          }),
          h(motion.button, {
            type:"button",
            className:"star"+(activeBookmarked?" saved":""),
            whileTap:{scale:.86,rotate:-8},
            onClick:toggleBookmark
          }, h(Icon,{name:"star",size:14}))
        ),
        suggestions.length>0 && h(motion.ul, {

          initial:{opacity:0,y:-5,scale:.985},
          animate:{opacity:1,y:0,scale:1},
          exit:{opacity:0,y:-4,scale:.99},
          transition:{type:"spring",stiffness:420,damping:30}
        },
          suggestions.map((item,i)=>
            h(motion.li, {

              onClick:()=>navigate(item.url),

            },
              h(Icon,{name:"search",size:13}),
              h("span",null,item.title||item.url),
              h("span",{className:"suggestion-type"},"WEB")
            )
          )
        )
      ),
      h(motion.button,{className:"icon-button",onClick:createTab,whileTap:{scale:.9}},h(Icon,{name:"plus"}))
    );

    const homeNode =
      !showResults && !currentUrl && h(
        motion.section,
        {

          animate:{opacity:1,scale:1},
          exit:{opacity:0,scale:.995},

          h(motion.form, {

            onSubmit:submitHome,

            animate:{y:0,opacity:1},
            transition:{delay:.08,type:"spring",stiffness:180,damping:22}
          },
            h("div",{className:"home-search-inner"},
              h(Icon,{name:"search",size:17}),
              h("input",{
                value:homeQuery,
                onChange:e=>{setHomeQuery(e.target.value);setQuery(e.target.value)},
                placeholder:"Search or enter URL",
                autoComplete:"off"
              })
            )
          ),
          h("div",{className:"shortcuts"},
            ["360 Search","Open source","Web development"].map((label,i)=>
              h(motion.button, {
                key:label,
                className:"shortcut",
                onClick:()=>{setHomeQuery(label);setQuery(label);search(label)},
                initial:{y:10,opacity:0},
                animate:{y:0,opacity:1},
                transition:{delay:.16+i*.045,type:"spring",stiffness:260,damping:25},
                whileHover:{y:-2,scale:1.015},
                whileTap:{scale:.97}
              }, label)
            )
          ),
          h(motion.div, {
            className:"warning",
            initial:{y:8,opacity:0},
            animate:{y:0,opacity:1},
            transition:{delay:.28,type:"spring",stiffness:240,damping:26}
          },
            h(Icon,{name:"shield",size:13}),
            h("span",null,"Not intended to bypass access restrictions.")
          )
        )
      );

    const resultNode=(item,i)=>{
      if(searchType==="image"){
        return h(motion.a,{
          key:item.url||item.image||i,
          className:"image-result",
          href:item.url||item.image||"#",
          target:"_blank",
          rel:"noopener noreferrer",
          initial:{opacity:0,y:8},
          animate:{opacity:1,y:0},
          transition:{delay:Math.min(i*.02,.16),type:"spring",stiffness:260,damping:28},
          whileHover:{y:-2,scale:1.008}
        },
          item.image&&h("img",{src:item.image,alt:item.title||"",loading:"lazy"}),
          h("div",{className:"image-result-copy"},

          )

        className:"result",

        h("div",{className:"result-title"},item.title||item.url),

        searchType==="news" && item.age && h("div",{className:"result-age"},item.age)

    const resultsNode =
      showResults && h(
        motion.section,

          animate:{opacity:1,y:0},

        },
        h("div",{className:"results-inner"},
          h("div",{className:"results-header"},
            h("span",{className:"results-query"},query),
            h("span",{className:"results-meta"},results.length+" results"),
            h("div",{className:"result-types"},
              [["web","Web"],["news","News"],["shopping","Shopping"],["image","Images"]].map(([type,label])=>
                h(motion.button,{
                  key:type,
                  className:"result-type"+(searchType===type?" active":""),
                  onClick:()=>{setSearchType(type);search(query,type)},
                  whileTap:{scale:.96}

              )

          searchType==="image"
            ? h("div",{className:"image-results"},results.map(resultNode))
            : results.length
              ? results.map(resultNode)
              : h("div",{className:"results-empty"},loading?"Searching…":"No results found.")
        )
      );

    const webNode =
      currentUrl && !showResults && h(
        motion.section,
        {

          initial:{opacity:0,scale:.995},
          animate:{opacity:1,scale:1},
          transition:{duration:.22}
        },
        h("iframe",{
          ref:frameRef,
          className:"frame",
          srcDoc:frameHtml,
          sandbox:"allow-same-origin allow-scripts allow-forms allow-popups allow-modals",
          title:"PROXUS"

    const settingsNode = settingsOpen && h(
      motion.div,
      {className:"settings-backdrop",initial:{opacity:0},animate:{opacity:1},exit:{opacity:0},onClick:()=>setSettingsOpen(false)},
      h(motion.aside,{className:"settings-panel",initial:{x:28,opacity:0},animate:{x:0,opacity:1},exit:{x:20,opacity:0},transition:{type:"spring",stiffness:320,damping:30},onClick:e=>e.stopPropagation()},
        h("div",{className:"settings-header"},
          h("div",{className:"settings-title"},"Settings"),
          h(motion.button,{className:"icon-button",onClick:()=>setSettingsOpen(false),whileTap:{scale:.9}},h(Icon,{name:"close",size:15}))
        ),
        h("div",{className:"settings-section"},
          h("div",{className:"settings-label"},"Search type"),
          h("div",{className:"settings-options"},
            [["web","Web"],["news","News"],["shopping","Shopping"],["image","Images"]].map(([type,label])=>
              h(motion.button,{key:type,className:"settings-option"+(searchType===type?" active":""),onClick:()=>setSearchType(type),whileTap:{scale:.97}},label)

        ),

          h("div",{className:"settings-label"},"Safe search"),
          h(motion.button,{className:"switch-row",onClick:()=>setSafeSearch(v=>!v),whileTap:{scale:.985}},
            h("span",null,safeSearch?"Moderate":"Off"),
            h("span",{className:"switch"+(safeSearch?" on":"")},h("span",null))
          )
        ),
        h("div",{className:"settings-section"},
          h("div",{className:"settings-label"},"Background"),
          h(motion.button,{className:"switch-row",onClick:()=>setDustEnabled(v=>!v),whileTap:{scale:.985}},
            h("span",null,"Falling dust"),
            h("span",{className:"switch"+(dustEnabled?" on":"")},h("span",null))
          )
        ),
        h("div",{className:"settings-section"},
          h("div",{className:"settings-label"},"Bookmarks"),
          bookmarks.length
            ? h("div",{className:"bookmark-list"},bookmarks.map(bookmark=>
                h(motion.button,{key:bookmark.url,className:"bookmark-list-item",onClick:()=>{setSettingsOpen(false);fetchPage(bookmark.url)}},
                  h("span",null,bookmark.title||bookmark.url),
                  h(Icon,{name:"external",size:12})
                )
              ))
            : h("div",{className:"settings-muted"},"No saved bookmarks")
        ),
        h("div",{className:"settings-section settings-note"},
          "PROXUS is not intended to bypass access restrictions."
        )
      )
    );

    const appNode = h(
      "div",
      {className:"app"},
      dustEnabled && h(Dust),
      h("div",{className:"shell"},
        sidebarNode,
        h("main",{className:"main"},
          toolbarNode,
          h("section",{className:"view"},
            homeNode,
            resultsNode,
            webNode,
            loading && h(motion.div,{className:"loading",initial:{opacity:0},animate:{opacity:1},exit:{opacity:0}},h(motion.div,{className:"loading-ring",animate:{rotate:360},transition:{repeat:Infinity,duration:.75,ease:"linear"}}))
          )
        )
      )
    );

    return h(React.Fragment,null,
      appNode,
      settingsNode,
      toast && h(motion.div,{className:"toast",initial:{opacity:0,y:10,scale:.97},animate:{opacity:1,y:0,scale:1},exit:{opacity:0,y:6,scale:.98},transition:{type:"spring",stiffness:360,damping:28}},h("strong",null,toast.title),toast.message)
    );
  }

  createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
